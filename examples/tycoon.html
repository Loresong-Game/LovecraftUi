<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LovecraftUI — Tycoon</title>
<!-- @demo   The Counting House: a profit line that survives losses, department bars hanging below the zero line, a five-thousand-row finance ledger that expands and sorts without forgetting, and an advisor center whose counsel is prioritized, read, and jumped to.
     @shows  LineChart, BarChart, TreeTable, NotificationCenter, SpeedControl, ResourceChip, RadialMenu, Window, Button, TextNode, UINode, QuadNode
     @params ?freeze=1 — bit-stable snapshot boot (static ledger, parked clocks) · ?assert=1 — the in-page suite titles its own PASS count -->

<!-- the proof page. The profit line crosses zero and lives (the scale owns
     negatives; a single point owns a band); the department bars hang their losses
     below the zero line; the legend chips toggle series loud. The finance ledger
     holds five thousand rows behind a VirtualList — expand a ward, sort by
     upkeep, and the expand state survives the sort (the test suite pins it). The
     advisor center orders its counsel by priority, wears unread dots, and a
     click jumps to the ward inspector (the entity-inspector recipe). Date strip
     + SpeedControl ship as the header recipe. Sparkline, the heatmap legend,
     and the crosshair fell per the cut line (tooltip-only ships). -->
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060a}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<script>
window.__errs = [];
window.addEventListener('error', (e) => { window.__errs.push(e.message); document.title = 'ERROR@' + String(e.message).slice(0, 80); });
window.addEventListener('unhandledrejection', (e) => { window.__errs.push(String(e.reason)); document.title = 'ERROR@' + String(e.reason).slice(0, 80); });
const __consoleError = console.error.bind(console);
console.error = (...a) => { window.__errs.push(a.join(' ')); __consoleError(...a); };
</script>
<script type="module">
import {
  Eldritch, LineChart, BarChart, TreeTable, NotificationCenter, SpeedControl,
  ResourceChip, RadialMenu, Window, Button, TextNode, UINode, QuadNode, COLORS, FONTS, hitTest,
  makeResizable,
} from '../src/lovecraft-ui.js';

const params = new URLSearchParams(location.search);
const FROZEN = params.has('freeze');
const ASSERT = params.has('assert');
// the census boots must see the RESTING ledger — gate the sim at the source,
// not behind a dead window (the 12s resting delay is gone)
const INSTRUMENTED = FROZEN || ASSERT
  || params.has('audit') || params.has('torture') || params.has('resize');
Eldritch.init(FROZEN || ASSERT
  ? { background: false, vignette: false, timerDriven: true, contextMenu: false }
  : { contextMenu: false }); // the ground circle rides right-click
const engine = Eldritch.engine;

// ---- the icon pack (optional download): the RE-SKIN idiom ----
// `as:` points at icon ids this page ALREADY uses, so the registry re-bakes those NAMES
// in place: every live quad follows with no page code and no atlas movement.
// `fallback: 'none'` leaves the procedural art standing when assets/ is absent, which is
// the shipped default - the pack is an optional download and the page must not need it.
// Skipped under FROZEN: --screenshot captures at the load event and cannot wait for an
// async decode, so frozen baselines run on the procedural art by necessity.
if (!FROZEN) {
  Eldritch.loadIcons({
    base: '../assets/icons', fallback: 'none',
    icons: [
      { id: 'ico-3649', as: 'book' },
      { id: 'ico-0210', as: 'shield' },
      { id: 'ico-0513', as: 'sword' },
      { id: 'ico-0489', as: 'blindinglight' },
      { id: 'ico-0707', as: 'arrows' },
      { id: 'ico-0307', as: 'leafs' },
      { id: 'ico-0394', as: 'deathkiss' },
      { id: 'ico-0017', as: 'fireball' },
      { id: 'ico-0078', as: 'fireball2' },
    ],
  });
}

window.engine = engine;
const shadow = { color: 'rgba(0,0,0,0.85)', dx: 1, dy: 1, blur: 2 };

// Page placement must CHAIN a widget's own onLayout, never clobber it.
const place = (node, fn) => {
  const own = node.onLayout?.bind(node);
  node.onLayout = function () { own?.(); fn.call(this); };
};

// deterministic ledger numbers (the seeded idiom — frozen shots stay bit-stable)
function seededRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
const rng = seededRng(0x1730);
const TITHE_STATES = ['collected', 'in arrears', 'forgiven', 'refused', 'pending'];

// ---- the header recipe: date strip + speed + the treasury chip ----
const dateText = new TextNode('Autumn of the Third Year — The Drowned City', {
  font: FONTS.header, size: 14, smallCaps: true, letterSpacing: 2,
  color: COLORS.bone, shadow,
});
place(dateText, function () { this.setPos(24, 18); });
// THE HUD LIVES ON `background`, NOT `overlay`. LAYER_ORDER is [background, windows,
// dropdown, taskbar, overlay, ...], so `overlay` paints ABOVE `windows`. This page had
// its whole HUD on overlay and opened the department inspector on the windows band
// (correctly, per C5) — so the inspector opened UNDERNEATH the ledger, the advisors and
// the treasury row every time. That is the "windows open under other elements and
// stick" defect. Same defect as social-hud, same one-line cause.
engine.layers.background.add(dateText);
const speed = new SpeedControl({});
place(speed, function () { this.setPos(24, 44); });
engine.layers.background.add(speed);
const treasury = new ResourceChip({ icon: 'book', value: 12480, width: 120 });
place(treasury, function () { this.setPos(engine.width - this.w - 24, 18); });
engine.layers.background.add(treasury);

// ---- the profit line: three seasons, losses included ----
const profit = new LineChart({
  title: 'Profit',
  width: 420, height: 200,
  series: [
    { name: 'Income', points: [420, 510, 480, 620, 700, 660, 810, 900] },
    { name: 'Upkeep', points: [-380, -420, -390, -450, -520, -500, -560, -610] },
    { name: 'Net', points: [40, 90, 90, 170, 180, 160, 250, 290] },
  ],
});
place(profit, function () { this.setPos(24, 96); });
engine.layers.background.add(profit);

// ---- the department bars: gains above the zero line, losses hanging below ----
const departments = new BarChart({
  title: 'Wards',
  width: 380, height: 200,
  labels: ['Docks', 'Chapel', 'Market', 'Lamps', 'Warrens'],
  series: [
    { name: 'Yield', points: [320, -120, 260, 140, -60] },
    { name: 'Cost', points: [-180, -90, -140, -110, -70] },
  ],
});
place(departments, function () { this.setPos(468, 96); });
engine.layers.background.add(departments);

// ---- the finance ledger: five thousand rows behind the virtual window ----
const WARD_NAMES = ['Docks', 'Chapel', 'Market', 'Lamps', 'Warrens', 'Breakwater', 'Saltworks', 'Foundry'];
const ledgerRows = [];
let rowCount = 0;
for (let w = 0; w < 40; w++) {
  const kids = [];
  for (let k = 0; k < 124; k++) {
    kids.push({
      id: `w${w}-p${k}`,
      cells: (() => {
        const y = Math.round(rng() * 200 - 60), u = Math.round(rng() * 90);
        return {
          name: `Parcel ${w + 1}.${k + 1}`,
          yield: y,
          upkeep: u,
          net: y - u,
          tithe: TITHE_STATES[Math.floor(rng() * TITHE_STATES.length)],
        };
      })(),
    });
    rowCount++;
  }
  ledgerRows.push({
    id: `w${w}`,
    cells: (() => {
      const y = Math.round(rng() * 400 - 100), u = Math.round(rng() * 220);
      return {
        name: `${WARD_NAMES[w % WARD_NAMES.length]} ${Math.floor(w / WARD_NAMES.length) + 1}`,
        yield: y,
        upkeep: u,
        net: y - u,
        tithe: TITHE_STATES[Math.floor(rng() * TITHE_STATES.length)],
      };
    })(),
    children: kids,
  });
  rowCount++;
}
// the ledger was 380 wide with three narrow columns, sitting beside 500px of
// nothing - a five-thousand-row finance ledger reporting less than it had room for.
// Net and Tithe are the columns a counting house would actually keep, and the width
// now takes the lane the charts leave, so the lower half of the frame carries data
// instead of dark.
const ledger = new TreeTable({
  columns: [
    { key: 'name', label: 'Holding', width: 250 },
    { key: 'yield', label: 'Yield', width: 100 },
    { key: 'upkeep', label: 'Upkeep', width: 100 },
    { key: 'net', label: 'Net', width: 100 },
    { key: 'tithe', label: 'Tithe', width: 150 },
  ],
  rows: ledgerRows,
  width: 740, height: 300,
});
ledger.expanded.add('w0'); // the first ward opens for the shot
ledger.setRows(ledgerRows);
place(ledger, function () {
  this.setPos(24, 348);
  // the lane budget: the ledger takes what the advisor column leaves it
  const lane = Math.max(420, engine.width - advisors.w - 72);
  if (this.w !== lane) this.setSize(lane, this.h);
});
engine.layers.background.add(ledger);
const ledgerLabel = new TextNode(`The Ledger (${rowCount} holdings)`, {
  font: FONTS.header, size: 11, smallCaps: true, letterSpacing: 1,
  color: COLORS.textMuted, shadow,
});
place(ledgerLabel, function () { this.setPos(24, 330); });
engine.layers.background.add(ledgerLabel);

// ---- the entity-inspector recipe: a ward window raised by counsel ----
let inspector = null;
function inspectWard(name) {
  if (inspector && !inspector.disposed) inspector.dispose();
  // 132 tall, not 150: three counsel lines bottom near ~70 and the chrome eats
  // ~60 — the rest was dead stone (band sweep)
  inspector = new Window({
    title: `Ward: ${name}`, width: 250, height: 132,
    onClose: () => { inspector?.dispose(); inspector = null; },
    content: (c) => {
      const lines = [
        `Steward: the ${name} Committee`,
        'Mood: uneasy but taxed',
        'Counsel: raise the lamps, lower the levy',
      ];
      lines.forEach((s, i) => {
        const t = new TextNode(s, { size: 12, color: COLORS.text, shadow, maxWidth: 220, ellipsis: true });
        t.setPos(10, 8 + i * 22);
        c.add(t);
      });
    },
  });
  inspector.setPos(480, 340);
  engine.layers.windows.add(inspector); // C5: windows live in the windows band
  return inspector;
}

// ---- the advisor center: prioritized counsel with jump-to ----
const advisors = new NotificationCenter({
  width: 300, maxVisible: 6, title: 'Advisors',
  onJump: (e) => {
    const note = advisors.notes.find((n) => n.id === e.id);
    if (note) inspectWard(note.title.split(' ')[0]);
  },
});
place(advisors, function () {
  this.setPos(engine.width - this.w - 24, 96);
  // anchored top-right → the grip lives bottom-left (opposite the anchor).
  // The old "lane budget" block here was DEAD CODE from birth: makeResizable's
  // return was discarded and NotificationCenter never sets `.grip`, so the
  // advisors have always walked uncapped — live proof of the freedom law
  // (no element budgets a grip; ResizeGrip's screen-bounds ceiling is the law).
});
engine.layers.background.add(advisors);
makeResizable(advisors, { corner: 'bl', minW: 240, minH: 160 });
advisors.push({ id: 'chapel', title: 'Chapel ward runs at a loss', priority: 2 });
advisors.push({ id: 'docks', title: 'Docks tithe collected', priority: 0 });
advisors.push({ id: 'warrens', title: 'Warrens flooding again', priority: 3 });
advisors.push({ id: 'lamps', title: 'Lamps ward requests oil', priority: 1 });
advisors.markRead('docks'); // one read line for the shot
// the input replay's handle bag (tools/drives/tycoon.json): names, never coordinates
window.__tycoon = { advisors, inspector: () => inspector,
  advisorRow: (id) => advisors._rows[advisors.notes.findIndex((n) => n.id === id)],
  ground: () => ground };

// ---- the ground circle: right-click on the harbour opens the steward's
// wheel; charts, the ledger, and the advisor center keep their own presses.
const ground = new RadialMenu({
 ground: true, //: the radial chain's terminus — an unconsumed right-click lands here
 items: [
 { id: 'wards', label: 'Wards', children: [
 { id: 'Docks', label: 'Docks' },
 { id: 'Yards', label: 'Yards' },
 { id: 'Gates', label: 'Gates' },
 ] },
 { id: 'counsel', label: 'Counsel', children: [
 { id: 'readall', label: 'Read All' },
 ] },
 ],
});
ground.on('select', ({ id, path }) => {
  // the same verbs the advisor jump and the read-all sweep drive: an inspect
  // raises the ward window; Read All clears every unread chip LOUD (a wheel
  // pick is a gesture, so the readchange voice speaks)
  if (path[0] === 'wards') inspectWard(id);
  else if (id === 'readall') advisors.markAllRead({ silent: false });
});
engine.bus.on('pointerdown', (e) => {
  if (e.button !== 2 || e.target) return;
  ground.toggle(e.x, e.y);
});

// ---- the living ledger (the instrumented boots stay parked at the source) ----
if (!INSTRUMENTED) {
  let t = 0, beat = 0, funds = 12480;
  engine.ticker.add((dt) => {
    t += dt;
    if (t < 1.2) return; // one breath, then the ledger lives
    beat += dt;
    if (beat > 4) {
      beat = 0;
      funds += Math.round(rng() * 120 - 40);
      treasury.setValue(funds);
      const last = profit.series[0].points;
      profit.setData(profit.series.map((s) => ({
        ...s, points: [...s.points.slice(1), s.points[s.points.length - 1] + Math.round(rng() * 60 - 30)],
      })), { silent: true });
      void last;
    }
  });
}

// ---- READY / ASSERT ----
if (!ASSERT) {
  setTimeout(() => {
    document.title = window.__errs.length ? 'TYCOON BOOT FAIL: ' + window.__errs[0] : 'TYCOON READY';
  }, 1000);
} else {
  (async () => {
    const results = [];
    let fails = 0;
    const ok = (name, cond) => { results.push(`${cond ? 'PASS' : 'FAIL'} ${name}`); if (!cond) fails++; };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    await wait(400); // settle the boot
    Eldritch.reducedMotion = true;

    ok('boot: the counting house stands (charts, ledger, counsel)',
      window.__errs.length === 0 && profit.series.length === 3
      && ledger.visibleRows.length > 40 && advisors.notes.length === 4);

    // ---- the scale math: negatives share the plot, a single point owns a band ----
    // derived from the DATA, not chosen numbers: a domain of -605 clipped
    // the Upkeep low point off the plot and still passed `< -600`
    const pts300 = profit.series.flatMap((s) => s.points);
    ok('scale: the profit domain spans every point the data holds',
      profit._domain.min <= Math.min(...pts300) && profit._domain.max >= Math.max(...pts300));
    const lone = new LineChart({ series: [{ name: 'One', points: [42] }], legend: false });
    lone.setPos(700, 620);
    engine.layers.background.add(lone);
    ok('scale: a single point owns a padded band, never a collapsed domain',
      lone._domain.max > lone._domain.min && lone._domain.min < 42 && lone._domain.max > 42);
    lone.dispose();
    const empty = new BarChart({ series: [], legend: false });
    ok('scale: an empty chart holds the unit band without crashing',
      empty._domain.max > empty._domain.min);
    empty.dispose();

    // ---- the legend: toggling a series is loud and honest ----
    const toggles = [];
    profit.on('serieschange', (e) => toggles.push(`${e.name}:${e.visible}`));
    profit.setSeriesVisible('Upkeep', false, { silent: false });
    ok('legend: hiding a series commits {name, visible:false}',
      toggles.join('|') === 'Upkeep:false' && profit.series[1].hidden === true);
    // the chip is DRIVEN by dispatch (the model verb) but first the REAL probe
    // proves a pointer could land on it at all — dispatch bypasses hit testing
    const upkeepChip = profit._chips[1];
    const hitChip = hitTest(engine, upkeepChip.worldX + upkeepChip.w / 2, upkeepChip.worldY + upkeepChip.h / 2);
    ok('hit-reach: the legend chip answers the real hit probe',
      hitChip === upkeepChip || (upkeepChip.isAncestorOf ? upkeepChip.isAncestorOf(hitChip) : false));
    upkeepChip.dispatch('click', {});
    ok('legend: the chip click restores it loud',
      toggles.join('|') === 'Upkeep:false|Upkeep:true' && profit.series[1].hidden === false);

    // ---- the ledger: virtualization, expansion, and the sort that never forgets ----
    // expected flat counts derive from the rows the page BUILT (the data), never the
    // generator's loop literals — the suite names which wards it holds open
    const expectVisible = (...open) => ledgerRows.reduce(
      (n, r) => n + 1 + (open.includes(r.id) ? r.children.length : 0), 0);
    ok('ledger: five thousand rows flatten to the collapsed wards plus one open',
      ledger.visibleRows.length === expectVisible('w0'));
    const pooled = ledger.list._pool.length;
    // the pool bound is BEHAVIORAL: swapped the bare 40 for the
    // widget's own sizing formula — a self-mirror that could only red if the
    // formula changed, the class that release condemned. The window claim is
    // that the pool tracks the VIEWPORT, not the data: below the visible model
    // here, and the expand below must not grow it.
    ok('ledger: the virtual window pools one screenful, not five thousand',
      pooled > 0 && pooled < ledger.visibleRows.length);
    // rowactivate (re-pinned through REAL pointer events — the old
 // pin hand-dispatched `click` onto the list, bypassing hit testing, and its
 // scroll term was a no-op at scrollY 0; the ledger is pre-scrolled now and
 // the press crosses the whole input pipe)
    ledger.list.setScroll(2 * ledger.rowH);
    await wait(60);
    let act338 = null;
    const offAct338 = ledger.on('rowactivate', (e) => { act338 = e.row; });
    const rx338 = ledger.list.worldX + 120;
    const ry338 = ledger.list.worldY + 2 * ledger.rowH + 4; // + scrollY = row index 4
    engine.canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: rx338, clientY: ry338, pointerId: 91, button: 0, buttons: 1, bubbles: true }));
    engine.canvas.dispatchEvent(new PointerEvent('pointerup', { clientX: rx338, clientY: ry338, pointerId: 91, button: 0, buttons: 0, bubbles: true }));
    await wait(60);
    offAct338();
    ok('ledger: a REAL row-body press activates the row under the pointer, scroll term live',
      act338 !== null && act338 === ledger.visibleRows[4].row);
    ledger.list.setScroll(0);
    await wait(60);
    ledger.toggle('w1');
    ok('ledger: expanding a second ward grows the flat list by its parcels',
      ledger.visibleRows.length === expectVisible('w0', 'w1'));
    ok('ledger: the pool did not grow with the model (the windowing claim itself)',
      ledger.list._pool.length === pooled);
    ledger.sort('upkeep', -1);
    ok('ledger: the sort keeps every expanded ward open (the state survives)',
      ledger.expanded.has('w0') && ledger.expanded.has('w1')
      && ledger.visibleRows.length === expectVisible('w0', 'w1') && ledger.sortKey === 'upkeep');
    const roots = ledger.visibleRows.filter((v) => v.depth === 0).map((v) => v.row.cells.upkeep);
    ok('ledger: the sibling order follows the sorted column',
      roots[0] >= roots[1] && roots[1] >= roots[roots.length - 1]);
    ledger.toggle('w1');
    ledger.collapseAll();
    ok('ledger: collapse-all folds the flat list back to the wards',
      ledger.visibleRows.length === expectVisible());
    ledger.expanded.add('w0');
    ledger.setRows(ledgerRows);
    ok('ledger: setRows respects the surviving expand set',
      ledger.visibleRows.length === expectVisible('w0'));

    // ---- the counsel: priority orders it, jumping reads it ----
    // the ORDER LAW, checked pairwise on the notes themselves (priority strictly
    // descends; equal priorities keep arrival order) — never a pinned id string
    const counsel = advisors.notes;
    ok('counsel: priority orders the ledger, ties keep arrival',
      counsel.length === 4 && counsel.every((n, i) => i === 0
        || counsel[i - 1].priority > n.priority
        || (counsel[i - 1].priority === n.priority && counsel[i - 1]._ord < n._ord)));
    ok('counsel: the read line lost its dot', advisors.unreadCount === 3);
    const jumps = [];
    advisors.on('jump', (e) => jumps.push(e.id));
    advisors.jump('warrens');
    await wait(60);
    ok('counsel: a jump marks read, commits loud, and raises the inspector',
      jumps.join(',') === 'warrens' && advisors.unreadCount === 2
      && inspector != null && !inspector.disposed);
    // the layering fix, ASSERTED: the inspector opens on `windows`, the HUD
    // lives on `background`, so the real probe at its center must answer for the
    // window — not for the ledger or the counsel it used to open UNDERNEATH
    const hitIns = hitTest(engine, inspector.worldX + inspector.w / 2, inspector.worldY + inspector.h / 2);
    ok('hit-reach: the raised inspector stands above the HUD it rose from',
      hitIns != null && (hitIns === inspector || inspector.isAncestorOf(hitIns)));
    // the inspector hugs its counsel: no dead stone, no phantom range
    {
      const sa = inspector.contentArea, slack = sa.boxH - sa.contentH;
      ok(`the inspector hugs its counsel [boxH ${sa.boxH} contentH ${sa.contentH}]`,
        sa.vBarVisible === false && sa.maxScroll === 0 && slack >= 0 && slack <= 24);
    }
    // the ground circle: right-click on the harbour opens the wheel,
    // and a nested Wards>Docks pick raises the same inspector the counsel jump raises
    engine.bus.emit('pointerdown', { x: 640, y: 500, button: 2, pointerId: 96, target: null, native: null });
    await wait(60);
    ok('ground: a right-click on the harbour opens the steward\'s wheel',
      window.__tycoon.ground().isOpen === true);
    window.__tycoon.ground()._setIndex(0, false); // Wards
    window.__tycoon.ground().onActivate();
    await wait(40);
    window.__tycoon.ground()._setIndex(0, false); // Docks
    window.__tycoon.ground().onActivate();
    await wait(80);
    ok('ground: the nested Docks pick raises the ward inspector',
      window.__tycoon.ground().isOpen === false
      && inspector != null && !inspector.disposed && inspector.title._text === 'Ward: Docks');
    inspector.dispose(); inspector = null;
    advisors.markAllRead();
    ok('counsel: mark-all silences the ledger', advisors.unreadCount === 0);
    const before = advisors.notes.length;
    advisors.push({ id: 'chapel', title: 'Chapel ward flooded the crypt', priority: 5 });
    ok('counsel: re-pushing an id refreshes it to the top, never duplicates',
      advisors.notes.length === before && advisors.notes[0].id === 'chapel'
      && advisors.unreadCount === 1);

    // ---- the construction budget: the kit bakes NOTHING into the atlas ----
    const t0 = engine.textures.count;
    const batch = [
      new LineChart({}), new BarChart({}),
      new TreeTable({}), new NotificationCenter({}),
    ];
    ok('budget: the four counting-house widgets cost zero atlas textures',
      engine.textures.count === t0);
    for (const w of batch) w.dispose();

    // ---- the NaN ctor laws ----
    const nanL = new LineChart({ width: NaN, height: NaN });
    const nanT = new TreeTable({ width: NaN, height: NaN, rowH: NaN });
    const nanN = new NotificationCenter({ width: NaN, maxVisible: NaN, maxNotes: NaN });
    ok('nan: every ctor guards to its defaults',
      nanL._cw === 320 && nanL._ch === 180 && nanT.rowH === 24
      && nanN.maxVisible === 6 && nanN.maxNotes === 50);
    nanL.dispose(); nanT.dispose(); nanN.dispose();

    // hit-reach: the REAL probe answers for the speed control (the dispatch blind spot)
    const hitSC = hitTest(engine, speed.worldX + speed.w / 2, speed.worldY + speed.h / 2);
    ok('hit-reach: the speed control answers the real hit probe',
      hitSC === speed || (speed.isAncestorOf ? speed.isAncestorOf(hitSC) : false));

    // polish (unmistakable tree interactions, still a
 // table): a real chevron on parents, a child-count chip, a depth rail
    {
      const openBefore = [...ledger.expanded];
      ledger.collapseAll();
      await wait(80);
      const rows = ledger.list.content.children.filter((n) => n._item);
      const parentRow = rows.find((n) => n._item.hasKids && n._item.depth === 0);
      ok('ledger: a collapsed parent wears the closed chevron and its child count',
        parentRow != null && parentRow.expZone.glyph._text === '▸'
        && parentRow.kidCount.visible === true
        && parentRow.kidCount._text === String(parentRow._item.row.children.length));
      const pid = parentRow._item.row.id;
      ledger.toggle(pid);
      await wait(80);
      const rows2 = ledger.list.content.children.filter((n) => n._item);
      const openRow = rows2.find((n) => n._item.row.id === pid);
      const childRow = rows2.find((n) => n._item.depth === 1);
      ok('ledger: the open chevron turns down and the child row carries its depth rail',
        openRow != null && openRow.expZone.glyph._text === '▾'
        && childRow != null && childRow.rail.visible === true);
      ledger.collapseAll();
      for (const id of openBefore) ledger.expanded.add(id);
      ledger._refresh();
      await wait(80);
    }

    ok('no errors reached the console during the run', window.__errs.length === 0);

    Eldritch.reducedMotion = false;
    const pre = document.createElement('pre');
    pre.id = 'results';
    pre.style.cssText = 'position:fixed;left:8px;top:8px;max-height:95vh;overflow:auto;color:#8fe8a8;background:rgba(0,0,0,0.85);padding:10px;font:11px Consolas,monospace;z-index:100;margin:0;';
    pre.textContent = results.join('\n');
    document.body.appendChild(pre);
    document.title = `TYCOON ASSERT ${fails === 0 ? 'PASS' : 'FAIL'} ${results.length - fails}/${results.length}`;
  })();
}
</script>
