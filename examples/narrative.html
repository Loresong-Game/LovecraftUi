<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LovecraftUI — The Whispering Stage</title>
<!-- @demo   The Whispering Stage: letterboxed portrait dialogue on a typewriter, a timed choice, a parchment journal and document, one-line subtitles, and a sanity slider that makes the interface itself tremble.
     @shows  LetterboxBars, TypewriterText, ChoiceList, Journal, DocumentViewer, SubtitleBar, SanityFX, DialogPanel, QuestTracker, LoadingVeil, EldToast, RadialMenu, Slider, TextNode
     @params ?freeze=1 — bit-stable snapshot boot (sanity 0, bars hidden, text landed) · ?assert=1 — the in-page suite titles its own PASS count -->

<!-- the proof page. Advance the dialogue (the first press lands the typewriter,
     the second advances — the classic gate), answer the timed choice before the ring
     empties, watch the journal take the entry and the subtitle answer. The sanity
     slider drives SanityFX: the parchment and the dialogue tremble on render-only
     offsets (hit rects never move) while the vignette breathes; sanity 0 restores
     every pixel exactly. The letterbox engages EldNotify do-not-disturb — sends
     route to the log until the bars leave. -->
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060a}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<script>
window.__errs = [];
window.addEventListener('error', (e) => { window.__errs.push(e.message); document.title = 'ERROR@' + String(e.message).slice(0, 80); });
window.addEventListener('unhandledrejection', (e) => { window.__errs.push(String(e.reason)); document.title = 'ERROR@' + String(e.reason).slice(0, 80); });
const __consoleError = console.error.bind(console);
console.error = (...a) => { window.__errs.push(a.join(' ')); __consoleError(...a); };
</script>
<script type="module">
import {
  Eldritch, LetterboxBars, TypewriterText, ChoiceList, Journal, DocumentViewer,
  SubtitleBar, SanityFX, DialogPanel, QuestTracker, LoadingVeil, EldToast,
  RadialMenu, Slider, TextNode, EldNotify, EldEvents, COLORS, FONTS,
} from '../src/lovecraft-ui.js';

const params = new URLSearchParams(location.search);
const FROZEN = params.has('freeze');
const ASSERT = params.has('assert');
// the suite needs the vignette live (SanityFX pulses it); the snapshot boot stays bare
Eldritch.init(FROZEN ? { background: false, vignette: false, timerDriven: true, contextMenu: false }
  : ASSERT ? { background: false, vignette: true, timerDriven: true, contextMenu: false }
  : { contextMenu: false }); // the ground circle rides right-click
const engine = Eldritch.engine;

// ---- the icon pack (optional download): the RE-SKIN idiom ----
// `as:` points at icon ids this page ALREADY uses, so the registry re-bakes those NAMES
// in place: every live quad follows with no page code and no atlas movement.
// `fallback: 'none'` leaves the procedural art standing when assets/ is absent, which is
// the shipped default - the pack is an optional download and the page must not need it.
// Skipped under FROZEN: --screenshot captures at the load event and cannot wait for an
// async decode, so frozen baselines run on the procedural art by necessity.
if (!FROZEN) {
  Eldritch.loadIcons({
    base: '../assets/icons', fallback: 'none',
    icons: [
      { id: 'ico-3649', as: 'book' },
      { id: 'ico-0210', as: 'shield' },
      { id: 'ico-0513', as: 'sword' },
      { id: 'ico-0489', as: 'blindinglight' },
      { id: 'ico-0707', as: 'arrows' },
      { id: 'ico-0307', as: 'leafs' },
      { id: 'ico-0394', as: 'deathkiss' },
      { id: 'ico-0017', as: 'fireball' },
      { id: 'ico-0078', as: 'fireball2' },
    ],
  });
}

window.engine = engine;

// ---- the stage ----
const CPS = FROZEN || ASSERT ? 0 : 28; // frozen/assert boots land text instantly; the suite drives its own reveals

const SCRIPT = [
  { portrait: 'portrait.target', speaker: 'The Keeper', text: 'The lighthouse has not been {b}dark{/} in ninety years. Tonight the lamp refused the oil.' },
  { portrait: 'portrait.player', speaker: 'You', text: 'Refused? Lamps do not refuse. Show me the wick and I will show you salt damp.' },
  { portrait: 'portrait.target', speaker: 'The Keeper', text: 'Then climb with me and ask it yourself. It has been {i}asking for you{/} by name.' },
];
let scriptAt = 0;

const dialog = new DialogPanel({
  width: 470,
  portrait: SCRIPT[0].portrait, speaker: SCRIPT[0].speaker, text: SCRIPT[0].text,
  typewriter: CPS,
});
dialog.setPos(70, 380);
engine.layers.background.add(dialog);

const choice = new ChoiceList({
  width: 300,
  timer: FROZEN || ASSERT ? 0 : 18,
  choices: [
    { id: 'climb', text: 'Climb the tower' },
    { id: 'refuse', text: 'Refuse the summons' },
    // locked BY PLAY, not forever: the reason tells the player the way in, and
    // pushing the Sanity slider past the brink unlocks it (gateBurn below)
    { id: 'burn', text: 'Burn the ledger', disabled: true,
      reason: 'A sane hand refuses the flame. Push Sanity past 65 and the choice opens.' },
    { id: 'secret', text: 'The hidden door', hidden: true },
  ],
});
choice.setPos(580, 392);
engine.layers.background.add(choice);
if (choice.timerRing) {
  choice.timerRing.setPos(902, 396);
  engine.layers.background.add(choice.timerRing);
}

const journal = new Journal({
  width: 380, height: 268,
  entries: [{ id: 'arrival', title: 'The Arrival', body: 'The town of {b}Wael{/} keeps its shutters closed against the sea. Someone has paid my passage and my silence.', read: true }],
});
journal.setPos(70, 64);
engine.layers.background.add(journal);

const doc = new DocumentViewer({
  width: 420, height: 268,
  title: 'Harbor Ledger, Final Page',
  text: 'Entry the last: the {b}Grief of Wael{/} put out at dusk against all counsel. The lamp was lit. The lamp was answered.\n\nNo hand signed the return column.',
});
doc.setPos(490, 64);
engine.layers.background.add(doc);

const bars = new LetterboxBars({ coverage: 0.12 });
const subtitles = new SubtitleBar({ width: 620, safeBottom: 40 });
const sanity = new SanityFX({ targets: [dialog, journal, doc, choice], maxOffset: 2.5 });
engine.layers.background.add(sanity);

// ---- the arrival (absorbed from the retired dialogs-quests.html) ----
// FROZEN skips the staging entirely: the settled scene IS the bit-stable baseline,
// and a light page's capture races any delayed freeze stepping.
// INSTRUMENTED, not just FROZEN/ASSERT: the veil is a CLOCK, and its progress at
// census time decides where its flavour line sits over its own lit orb - the audit
// caught exactly that as a contrast violation (1.22:1). A census must read the
// resting stage, and a number that depends on when the screenshot fired is not a
// measurement (the tutorial-beacon lesson, same shape).
const INSTRUMENTED = FROZEN || ASSERT
  || params.has('audit') || params.has('torture') || params.has('resize');
let veil = null;
if (!INSTRUMENTED) {
  let loaded = 0;
  veil = new LoadingVeil({ title: 'Making Landfall', flavor: 'The harbor smells of low tide and old promises.', value: 0 });
  engine.layers.overlay.add(veil);
  const stopLoad = engine.ticker.add((dt) => {
    loaded = Math.min(100, loaded + dt * 80);
    veil.setValue(loaded, { animate: false });
    if (loaded >= 60) veil.setFlavor('Someone is waiting on the quay.');
    if (loaded >= 100) { stopLoad(); veil.fadeOut(); }
  });
}

// ---- the obligations the parley leaves behind (absorbed from dialogs-quests) ----
// A conversation that changes nothing is a cutscene. The choice commits into a real
// tracker, so the scene has a consequence you can still see after it ends.
const quests = new QuestTracker({ header: 'Obligations', width: 250, quests: [] });
quests.setPos(940, 64);   // the right margin the document leaves free
engine.layers.background.add(quests);
let obligation = null;
function takeObligation(id) {
  if (obligation) return;
  obligation = quests.addQuest(id === 'climb' ? {
    title: 'The Lamp Room',
    objectives: [
      { progress: '0/209', text: 'Climb to the lamp room', done: false },
      { progress: '', text: 'Ask the lamp what it wants', done: false },
    ],
  } : {
    title: 'The Drowned Correspondence',
    objectives: [
      { progress: '0/3', text: 'Recover the undelivered letters', done: false },
      { progress: '', text: 'Return to the Keeper', done: false },
    ],
  });
  EldToast.show({
    title: 'Obligation Accepted',
    message: id === 'climb' ? 'The Lamp Room' : 'The Drowned Correspondence',
    variant: 'achievement', icon: 'book', duration: 4,
  });
}

// ---- the controls ----
// the "Letterbox" button is gone. Cinematic bars belong to the SCENE -
// they close over the parley when it begins and lift when the choice is made, which is
// what they are for. A button that toggles them demonstrates a method, not a moment.

const sanityLabel = new TextNode('Sanity', {
  font: FONTS.header, size: 13, smallCaps: true, letterSpacing: 2, color: COLORS.accent,
});
sanityLabel.setPos(220, 668);
engine.layers.background.add(sanityLabel);
// the fray gate: the slider is the REAL unlock path for the sealed choice
const FRAY_GATE = 0.65;
let burnOpen = false;
function gateBurn(level) {
  const open = level >= FRAY_GATE;
  if (open === burnOpen) return;
  burnOpen = open;
  choice.setChoiceEnabled('burn', open);
  if (open && !FROZEN && !ASSERT) {
    EldNotify.send({ channel: 'banner', title: 'The Frayed Mind Sees the Way', message: 'The ledger can burn now.', duration: 2.5 });
  }
}
const sanitySlider = new Slider({
  min: 0, max: 100, value: 0, width: 220,
  onInput: (v) => { sanity.set(v / 100, { silent: true }); gateBurn(v / 100); },
});
// programmatic sets ride 'change'; drags ride onInput — the test suite hears both
sanitySlider.on('change', (e) => { sanity.set(e.value / 100, { silent: true }); gateBurn(e.value / 100); });
sanitySlider.setPos(290, 662);
engine.layers.background.add(sanitySlider);
// the input replay's handle bag (tools/drives/narrative.json): names, never coordinates
window.__narrative = { choice, sanitySlider, quests, journal,
  obligation: () => obligation,
  burnRow: () => choice._rows[choice.items.findIndex((it) => it.id === 'burn')],
  ground: () => ground };

// ---- the ground circle: right-click on the dark opens the wheel; the
// stage, choices, and journal keep their own presses. The Mind picks drive the
// SAME slider the hand drags (loud — the test suite hears the change), and the
// journal turns through its own page verb.
const ground = new RadialMenu({
 ground: true, //: the radial chain's terminus — an unconsumed right-click lands here
 items: [
 { id: 'mind', label: 'Mind', children: [
 { id: 'steady', label: 'Steady' },
 { id: 'fray', label: 'Fray' },
 ] },
 { id: 'journal', label: 'Journal', children: [
 { id: 'next', label: 'Next Page' },
 { id: 'first', label: 'First Page' },
 ] },
 ],
});
ground.on('select', ({ id, path }) => {
  if (path[0] === 'mind') sanitySlider.setValue(id === 'fray' ? 80 : 0, { silent: false });
  else if (path[0] === 'journal') journal.setPage(id === 'next' ? (journal.page ?? 0) + 1 : 0);
});
engine.bus.on('pointerdown', (e) => {
  if (e.button !== 2 || e.target) return;
  ground.toggle(e.x, e.y);
});

// ---- the scene wiring ----
// the bars close over the parley on the first advance and lift when the choice lands
dialog.on('advance', () => {
  if (!bars.shown) bars.show();
  scriptAt = (scriptAt + 1) % SCRIPT.length;
  dialog.setEntry(SCRIPT[scriptAt]);
});
choice.on('choice', ({ id, timeout }) => {
  if (bars.shown) bars.hide();
  if (!timeout) takeObligation(id);
  if (timeout) {
    subtitles.say({ speaker: 'The Keeper', text: 'The tide does not wait on your nerve.', duration: 3 });
    journal.addEntry({ id: 'hesit', title: 'Hesitation', body: 'I let the moment pass. The lamp stayed dark, and something in the dark stayed {i}patient{/}.' }, { silent: true });
    return;
  }
  subtitles.say({ speaker: 'You', text: id === 'climb' ? 'Hand me the lantern, then.' : 'Find another fool for the stairs.', duration: 3 });
  journal.addEntry({
    id: 'step-' + id,
    title: id === 'climb' ? 'The Climb' : 'The Refusal',
    body: id === 'climb'
      ? 'We took the stairs two hundred and nine steps up. The lamp room smelled of a struck match nobody had struck.'
      : 'I would not climb. The Keeper wrote my name in the log regardless, in a hand that was not his.',
  }, { silent: true });
});

// ---- READY / ASSERT ----
if (!ASSERT) {
  setTimeout(() => {
    document.title = window.__errs.length ? 'NARRATIVE BOOT FAIL: ' + window.__errs[0] : 'NARRATIVE READY';
  }, 1000);
} else {
  (async () => {
    const results = [];
    let fails = 0;
    const ok = (name, cond) => { results.push(`${cond ? 'PASS' : 'FAIL'} ${name}`); if (!cond) fails++; };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    // the cinematic layer exists between tooltip and vignette (the engine seam)
    ok('the cinematic layer stands in the stack', !!engine.layers.cinematic);

    // TypewriterText: throttled reveal, the type voice, skip lands + resolves
    const tw = new TypewriterText('The walls are listening tonight and they remember.', { size: 14, color: COLORS.text });
    tw.setPos(70, 600);
    engine.layers.background.add(tw);
    let typeSounds = 0;
    const offType = engine.bus.on('uisound', ({ kind }) => { if (kind === 'type') typeSounds++; });
    let twDone = false;
    const twP = tw.reveal(40).then(() => { twDone = true; });
    await wait(260);
    ok('reveal: mid-flight at 40cps the node is still revealing', tw.isRevealing === true);
    ok('reveal: the type voice narrates while glyphs land', typeSounds > 0);
    tw.skip();
    await wait(40);
    ok('reveal: skip lands the text and resolves the promise', twDone === true && tw.isRevealing === false);
    await twP;
    offType();

    // DialogPanel adoption: the first advance is a skip, the second advances
    let advances = 0;
    dialog.on('advance', () => advances++);
    dialog.typewriterCps = 30;
    dialog.setEntry(SCRIPT[1]);
    ok('dialog: setEntry with typewriter starts revealing', dialog.bodyText.isRevealing === true);
    dialog._advance();
    ok('dialog: the first press skips, never advances', advances === 0 && dialog.bodyText.isRevealing === false);
    dialog._advance();
    ok('dialog: the second press advances', advances === 1);

    // ChoiceList: hidden filtered, disabled skipped by the initial index, pick commits
    const picks = [];
    const cl = new ChoiceList({
      width: 240,
      choices: [
        { id: 'a', text: 'First voice', disabled: true },
        { id: 'b', text: 'Second voice' },
        { id: 'x', text: 'Unseen voice', hidden: true },
      ],
      onChoice: (v, payload) => picks.push(payload),
    });
    cl.setPos(950, 80);
    engine.layers.background.add(cl);
    ok('choice: hidden choices never build rows', cl.choices.length === 2 && cl.items.length === 2);
    ok('choice: the initial index skips the disabled row', cl.index === 1);
    cl.onActivate();
    ok('choice: activation commits {id, timeout:false}', picks.length === 1 && picks[0].id === 'b' && picks[0].timeout === false);

    // the fray gate: the LIVE page's sealed choice unlocks through the slider's
    // real path, re-locks when sanity returns, and fires once open.
    // The padlock rides the same lock: visible on a sealed row, gone open.
    const burnRow = choice._rows[choice.items.findIndex((it) => it.id === 'burn')];
    ok('gate: the ledger choice boots sealed with a spoken reason',
      choice.items.find((it) => it.id === 'burn').disabled === true
      && typeof choice.items.find((it) => it.id === 'burn').reason === 'string');
    ok('gate: the sealed row wears its padlock', burnRow._lock.visible === true);
    sanitySlider.setValue(80, { silent: false });
    ok('gate: pushing sanity past the brink unlocks the choice',
      choice.items.find((it) => it.id === 'burn').disabled === false);
    ok('gate: the unlock takes the padlock with it', burnRow._lock.visible === false);
    sanitySlider.setValue(10, { silent: false });
    ok('gate: a steadied mind seals it again',
      choice.items.find((it) => it.id === 'burn').disabled === true);
    ok('gate: the padlock returns with the seal', burnRow._lock.visible === true);
    sanitySlider.setValue(90, { silent: false });
    const burnPicks = [];
    choice.on('choice', (e) => burnPicks.push(e.id));
    choice._setIndex(choice.items.findIndex((it) => it.id === 'burn'), false);
    choice._select();
    ok('gate: the unlocked choice actually fires', burnPicks.includes('burn'));
    sanitySlider.setValue(0, { silent: false });

    // ChoiceList timer: the ring drains and expiry commits a timeout
    const cl2 = new ChoiceList({
      width: 240, timer: 0.25,
      choices: [{ id: 'only', text: 'Too slow' }],
      onChoice: (v, payload) => picks.push(payload),
    });
    cl2.setPos(950, 240);
    engine.layers.background.add(cl2);
    await wait(650);
    const expiry = picks[picks.length - 1];
    ok('choice: the timer expires into {index:-1, timeout:true}', picks.length === 2 && expiry.timeout === true && expiry.index === -1);
    ok('choice: the ring drained to zero', cl2.timerRing.value === 0);

    // LetterboxBars: DND engages, sends route to the log, restore on full hide
    bars.show({ silent: true });
    ok('letterbox: show engages do-not-disturb', EldNotify.doNotDisturb === true);
    // both halves of the routing: no banner rises AND the line reaches the log —
    // a send that was simply DROPPED would pass the null check alone
    const routed = [];
    const offTap = EldEvents.tap((msg, type) => { if (type === 'NOTIFY') routed.push(msg); });
    EldNotify.send({ channel: 'banner', title: 'Muffled Omen', duration: 10 });
    offTap();
    ok('letterbox: a send under DND routes to the log, no banner rises',
      EldNotify._banner === null && routed.includes('Muffled Omen'));
    bars.hide({ silent: true });
    await wait(700);
    ok('letterbox: DND restores when the bars have fully left', EldNotify.doNotDisturb === false);

    // SanityFX: tremor on render-only offsets, vignette breathes, level 0 restores EXACTLY
    const dialogRestX = dialog.x; // the resting x, captured BEFORE the tremor drives
    sanity.set(0.9, { silent: true });
    let sawOffset = false;
    let sawVignette = false;
    for (let i = 0; i < 12; i++) {
      await wait(40);
      if (Math.abs(dialog.fxOffsetX) > 0 || Math.abs(journal.fxOffsetY) > 0) sawOffset = true;
      if (engine._vignette && engine._vignette.fxOpacity < 1) sawVignette = true;
      if (sawOffset && sawVignette) break;
    }
    ok('sanity: the tremor rides fxOffset while layout holds', sawOffset && dialog.x === dialogRestX);
    ok('sanity: the vignette breathes below full depth', sawVignette);
    sanity.set(0, { silent: true });
    await wait(60);
    const restored = [dialog, journal, doc, choice].every((n) => n.fxOffsetX === 0 && n.fxOffsetY === 0);
    ok('sanity: level 0 restores every offset exactly', restored);
    ok('sanity: level 0 restores the vignette exactly', !engine._vignette || engine._vignette.fxOpacity === 1);

    // NaN seeding: poisoned options fall to defaults, never NaN
    const nanBars = new LetterboxBars({ coverage: NaN, dur: NaN });
    ok('nan: LetterboxBars coverage/dur guard to defaults', nanBars.coverage === 0.12 && nanBars.dur === 0.35);
    nanBars.dispose();
    const nanFx = new SanityFX({ maxOffset: NaN });
    ok('nan: SanityFX maxOffset guards to its default', nanFx.maxOffset === 2);
    nanFx.dispose();

    // Journal: the round-trip (add opens, markRead clears the chip, pages count)
    const jEvents = [];
    const j = new Journal({ width: 300, height: 220, onChange: (v, p) => jEvents.push(p.action) });
    j.setPos(950, 420);
    engine.layers.background.add(j);
    j.addEntry({ id: 'e1', title: 'First Leaf', body: 'Ink not yet dry.' });
    ok('journal: an added entry opens unread', j.entries.length === 1 && j.newChip.visible === true);
    j.markRead('e1');
    ok('journal: markRead clears the chip', j.newChip.visible === false && j.entries[0].read === true);
    j.addEntry({ id: 'e2', title: 'Second Leaf', body: 'The margin answers back.' });
    ok('journal: the second entry opens at 2/2', j.pageText._text === '2/2' || j.pageText._pendingText === '2/2');
    j.setPage(0);
    ok('journal: setPage walks back to 1/2', (j.pageText._text ?? j.pageText._pendingText) === '1/2');
    ok('journal: the change stream carried add/read/add', jEvents.join(',') === 'add,read,add');

    // SubtitleBar: a line rises, clears on schedule, and settles its promise
    let subDone = false;
    subtitles.say({ speaker: 'Keeper', text: 'It stirs beneath the light.', duration: 0.6 }).then(() => { subDone = true; });
    await wait(60);
    ok('subtitle: the line has height while it speaks', subtitles.h > 0);
    await wait(1000);
    ok('subtitle: the line clears and its promise settles', subtitles.h === 0 && subDone === true);

    // the ground circle: right-click on the dark opens the wheel, and
    // the nested Mind>Fray pick drives the SAME slider the hand drags — loud,
    // so the burn gate hears it
    engine.bus.emit('pointerdown', { x: 900, y: 200, button: 2, pointerId: 62, target: null, native: null });
    await wait(60);
    ok('ground: a right-click on the dark opens the wheel',
      window.__narrative.ground().isOpen === true);
    window.__narrative.ground()._setIndex(0, false); // Mind
    window.__narrative.ground().onActivate();
    await wait(40);
    window.__narrative.ground()._setIndex(1, false); // Fray
    window.__narrative.ground().onActivate();
    await wait(60);
    ok('ground: the nested Fray pick frays the mind through the slider',
      window.__narrative.ground().isOpen === false && sanitySlider.value === 80);
    sanitySlider.setValue(0, { silent: false }); // steady the stage for the shot below

    ok('no errors reached the console during the run', window.__errs.length === 0);

    const pre = document.createElement('pre');
    pre.id = 'results';
    pre.style.cssText = 'position:fixed;left:8px;top:8px;max-height:95vh;overflow:auto;color:#8fe8a8;background:rgba(0,0,0,0.85);padding:10px;font:11px Consolas,monospace;z-index:100;margin:0;';
    pre.textContent = results.join('\n');
    document.body.appendChild(pre);
    document.title = `NARRATIVE ASSERT ${fails === 0 ? 'PASS' : 'FAIL'} ${results.length - fails}/${results.length}`;
  })();
}
</script>
</body>
</html>
