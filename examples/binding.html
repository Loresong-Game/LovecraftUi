<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LovecraftUI — Binding</title>
<!-- @demo   The bound ledger: one fake model drives the HUD both directions, a DevPanel cheats at it, and the window layout persists.
     @shows  Store, bind, bindText, bindEnabled, DevPanel, DebugConsole, DebugInspector, RadialMenu, EldWindow, Button, Slider, ToggleLabel, TextField, ProgressBar, VBox, TextNode
     @params ?freeze=1 — bit-stable snapshot boot (no ambiance, drain off) · ?assert=1 — the in-page suite titles its own PASS count -->

<!-- the proof page, rebuilt on the layout engine (the design requirement's page half; the
 DevPanel itself was rebuilt on window furniture in). One Store is the whole
     model: The Vessel READS it (bars and text), The Hand WRITES it (the same paths
     through sliders, a text field, and a toggle — two-way, loop-free), a ticking
     drain mutates it on the game's side, and the CHEATS window (the F2 hotkey rides
     the bus, so it fires no matter what holds focus) cheats at all of it. The
     Ledger's buttons round-trip the managed windows' layout through localStorage.
     All three windows measure their own content and the tiling derives from
     the measured widths. FROZEN and ASSERT boot with the drain off: a model that
     ticks once a second cannot hold a bit-stable frame or a settled assert. -->
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060a}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<script>
// Boot-health protocol: any error surfaces in the title so headless DOM dumps can gate
// on it (the page manifest lists this page as READY). Hooks must precede the module script.
window.__errs = [];
window.addEventListener('error', (e) => { window.__errs.push(e.message); document.title = 'ERROR@' + String(e.message).slice(0, 80); });
window.addEventListener('unhandledrejection', (e) => { window.__errs.push(String(e.reason)); document.title = 'ERROR@' + String(e.reason).slice(0, 80); });
const __consoleError = console.error.bind(console);
console.error = (...a) => { window.__errs.push(a.join(' ')); __consoleError(...a); };
</script>
<script type="module">
import {
  Eldritch, EldWindow,
  Store, bind, bindText, bindEnabled, DevPanel, DebugConsole, DebugInspector,
  Button, Slider, ToggleLabel, TextField, ProgressBar, RadialMenu,
  VBox, TextNode,
  runAudit, COLORS, FONTS,
} from '../src/lovecraft-ui.js';

// ?freeze=1 (snapshots) and ?assert=1 (the in-page suite) both need real frames
// under headless dump-dom, where rAF never fires — the timer-driven clock
const params = new URLSearchParams(location.search);
const FROZEN = params.has('freeze');
const ASSERT = params.has('assert');
Eldritch.init(FROZEN || ASSERT
  ? { background: false, vignette: false, timerDriven: true, contextMenu: false }
  : { contextMenu: false }); // the ground circle rides right-click
const engine = Eldritch.engine;

// ---- the icon pack (optional download): the RE-SKIN idiom ----
// `as:` points at icon ids this page ALREADY uses, so the registry re-bakes those NAMES
// in place: every live quad follows with no page code and no atlas movement.
// `fallback: 'none'` leaves the procedural art standing when assets/ is absent, which is
// the shipped default - the pack is an optional download and the page must not need it.
// Skipped under FROZEN: --screenshot captures at the load event and cannot wait for an
// async decode, so frozen baselines run on the procedural art by necessity.
if (!FROZEN) {
  Eldritch.loadIcons({
    base: '../assets/icons', fallback: 'none',
    icons: [
      { id: 'ico-3649', as: 'book' },
      { id: 'ico-0210', as: 'shield' },
      { id: 'ico-0513', as: 'sword' },
      { id: 'ico-0489', as: 'blindinglight' },
      { id: 'ico-0707', as: 'arrows' },
      { id: 'ico-0307', as: 'leafs' },
      { id: 'ico-0394', as: 'deathkiss' },
      { id: 'ico-0017', as: 'fireball' },
      { id: 'ico-0078', as: 'fireball2' },
    ],
  });
}

window.engine = engine;

const shadow = { color: 'rgba(0,0,0,0.85)', dx: 1, dy: 1, blur: 2 };
const CONTROL_W = 270;

// ---- the model: one store, three writers (the Hand, the CHEATS window, the drain).
// The drain starts OFF under FROZEN/ASSERT: a once-a-second mutation cannot hold a
// bit-stable baseline, and it would shear values out from under the suite's reads.
const store = new Store({
  player: { hp: 74, mana: 40, name: 'Ilse of the Quay', level: 7 },
  gold: 120,
  cheats: { drain: !(FROZEN || ASSERT) },
  ui: { edits: true },
});

// a caption tight above its control — the repeating row shape on this page
const block = (caption, control) => {
  const b = new VBox({ gap: 4 });
  b.add(new TextNode(caption, { size: 11, color: COLORS.textFaint, shadow }), control);
  return b;
};

// ---- The Vessel: reads the model ----
let vessel = null;
const vesselWin = EldWindow.create({
  id: 'vessel', title: 'The Vessel', x: 30, y: 16,
  content: (c, win) => {
    const name = new TextNode('', {
      font: FONTS.header, size: 14, smallCaps: true, letterSpacing: 1, color: COLORS.accent, shadow,
    });
    bindText(name, store, 'player.name');
    const level = new TextNode('', { size: 12, color: COLORS.textMuted, shadow });
    bindText(level, store, 'player.level', (v) => `Circle ${v}`);
    const head = new VBox({ gap: 2 });
    head.add(name, level);

    const hp = new ProgressBar({ value: 0, width: CONTROL_W, height: 22, segments: 10 });
    bind(hp, store, 'player.hp');
    const mp = new ProgressBar({ value: 0, width: CONTROL_W, height: 22 });
    bind(mp, store, 'player.mana');

    const gold = new TextNode('', { font: FONTS.mono, size: 13, color: COLORS.positive, shadow });
    bindText(gold, store, 'gold', (v) => `${v} gold`);

    const root = new VBox({ padding: { t: 8, r: 8, b: 0, l: 8 }, gap: 10 }); // roots claim ink (law)
    root.add(head, block('Vitality', hp), block('Will', mp), gold);
    c.add(root);
    vessel = { win, hp, mp, gold };
  },
});

// ---- The Hand: writes the same paths (two-way, loop-free) ----
let hand = null;
const handWin = EldWindow.create({
  id: 'hand', title: 'The Hand', x: 420, y: 16,
  content: (c, win) => {
    const edits = new ToggleLabel('Allow edits', {});
    bind(edits, store, 'ui.edits');

    const hpSl = new Slider({ min: 0, max: 100, step: 1, width: CONTROL_W });
    bind(hpSl, store, 'player.hp');
    bindEnabled(hpSl, store, 'ui.edits');
    const mpSl = new Slider({ min: 0, max: 100, step: 1, width: CONTROL_W });
    bind(mpSl, store, 'player.mana');
    bindEnabled(mpSl, store, 'ui.edits');
    const nameField = new TextField({ width: CONTROL_W });
    bind(nameField, store, 'player.name');
    bindEnabled(nameField, store, 'ui.edits');

    const drain = new ToggleLabel('Drain vitality', {});
    bind(drain, store, 'cheats.drain');

    const alms = new Button('Give 10 Gold', { minWidth: 140 });
    alms.on('click', () => store.set('gold', (store.get('gold') ?? 0) + 10));

    const root = new VBox({ padding: { t: 8, r: 8, b: 0, l: 8 }, gap: 10 }); // roots claim ink (law)
    root.add(edits, block('Vitality', hpSl), block('Will', mpSl), block('Name', nameField), drain, alms);
    c.add(root);
    hand = { win, hpSl, mpSl, nameField, alms };
  },
});

// ---- The Ledger: the layout round-trip ----
const LAYOUT_KEY = 'eldritch-binding-layout';
let ledger = null;
const ledgerWin = EldWindow.create({
  id: 'ledger', title: 'The Ledger', x: 790, y: 16,
  content: (c, win) => {
    const save = () => localStorage.setItem(LAYOUT_KEY, JSON.stringify(EldWindow.serializeLayout()));
    const load = () => {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved) EldWindow.restoreLayout(saved);
    };
    const saveBtn = new Button('Save Layout', { minWidth: 240 });
    saveBtn.on('click', save);
    const loadBtn = new Button('Restore Layout', { minWidth: 240 });
    loadBtn.on('click', load);
    const root = new VBox({ padding: { t: 8, r: 8, b: 0, l: 8 }, gap: 8 }); // roots claim ink (law)
    root.add(saveBtn, loadBtn);
    c.add(root);
    ledger = { win, save, load };
  },
});

// ---- the fake game: a drain that mutates the model from the other side ----
let acc = 0;
engine.ticker.add((dt) => {
  if (!store.get('cheats.drain')) return;
  acc += dt;
  if (acc < 1) return;
  acc = 0;
  store.set('player.hp', Math.max(0, (store.get('player.hp') ?? 0) - 2));
  store.set('player.mana', Math.min(100, (store.get('player.mana') ?? 0) + 1));
});

// ---- the tiling: derived from the MEASURED windows (the rule — hand-tuned
// rects overlap the moment honest sizes land), then the CHEATS window below ----
const TILE = 16;
const handX = 30 + vesselWin.w + TILE;
handWin.setPos(handX, TILE);
vesselWin.setPos(30, TILE);
ledgerWin.setPos(handX + handWin.w + TILE, TILE);
const row2 = TILE + Math.max(vesselWin.h, handWin.h, ledgerWin.h) + TILE;

// ---- the cheat panel (the F2 hotkey recalls it; the header click collapses) ----
const cheats = DevPanel.fromSpec({
  title: 'CHEATS — F2', hotkey: 'F2', x: 30, y: row2,
  fields: [
    { type: 'readout', label: 'Vitality', path: 'player.hp' },
    { type: 'slider', label: 'Set vitality', path: 'player.hp', min: 0, max: 100, step: 1 },
    { type: 'toggle', label: 'Drain', path: 'cheats.drain' },
    { type: 'button', label: 'Full Heal', onClick: () => store.set('player.hp', 100) },
  ],
}, store);

// ---- the bench tools (absorbed from the retired devtools.html) ----
// devtools.html armed a DebugConsole and a DebugInspector over a "Specimen Cabinet"
// that existed only to be inspected - a button called "Disturb Something" incrementing
// a counter, over ~90% black. The tools belong HERE, over a scene that is already a
// real model: the console's commands write the STORE, so every binding on the page
// answers them, which is the thing a dev console is actually for.
const con = new DebugConsole();
engine.layers.overlay.add(con);
con.register('gold', (rest) => {
  const n = parseInt(rest, 10);
  if (!Number.isFinite(n)) return `gold is ${store.get('gold')}`;
  store.set('gold', Math.max(0, n));
  return `gold set to ${store.get('gold')}`;
}, 'gold <n> — write the treasury through the store');
con.register('hurt', (rest) => {
  const n = Math.max(1, parseInt(rest, 10) || 10);
  store.set('player.hp', Math.max(0, store.get('player.hp') - n));
  return `vitality now ${store.get('player.hp')}`;
}, 'hurt <n> — take n off the vessel');
// Both tools sleep for every census (the INSTRUMENTED idiom). An open console drop
// with a live caret cannot hold a bit-stable frame, and the INSPECTOR raises its own
// ModalWindow - which lands on top of the three this page already tiles, measured as
// a 166x116 overlap violation. A dev tool is chrome the developer summons, not part
// of the resting page, so the census reads the page WITHOUT them.
const INSTRUMENTED = FROZEN || ASSERT
  || params.has('audit') || params.has('torture') || params.has('resize');
if (!INSTRUMENTED) con.open();

let inspector = null;
if (!INSTRUMENTED) {
  inspector = new DebugInspector();
  window.__inspector = inspector; // ad-hoc poking from the real devtools
}

window.__binding = { store, vessel, hand, ledger, cheats, con, ground: () => ground };

// ---- the ground circle: right-click on the bench opens the wheel —
// the console door and the two cheats the DevPanel already offers, all writing
// the ONE store every widget binds to.
const ground = new RadialMenu({
 ground: true, //: the radial chain's terminus — an unconsumed right-click lands here
 items: [
 { id: 'console', label: 'Console' },
 { id: 'cheats', label: 'Cheats', children: [
 { id: 'heal', label: 'Full Heal' },
 { id: 'gold', label: 'Give Gold' },
 ] },
 ],
});
ground.on('select', ({ id, path }) => {
  if (id === 'console') con.open();
  else if (path[0] === 'cheats') {
    if (id === 'heal') store.set('player.hp', 100);
    else store.set('gold', (store.get('gold') ?? 0) + 10);
  }
});
engine.bus.on('pointerdown', (e) => {
  if (e.button !== 2 || e.target) return;
  ground.toggle(e.x, e.y);
});

// ---- ?assert=1: the in-page suite (behavior + key geometry, gated) ----
if (ASSERT) {
  const results = [];
  let fails = 0;
  const ok = (name, cond) => { results.push(`${cond ? 'PASS' : 'FAIL'} ${name}`); if (!cond) fails++; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    await wait(400); // the boxes converge and the measured windows settle

    // one store, three readers: the vessel bar, the hand slider, the cheats slider
    store.set('player.hp', 42);
    await wait(60);
    const cheatsSlider = cheats.body.children.find((n) => n instanceof Slider);
    ok('one write reaches every bound reader',
      vessel.hp.value === 42 && hand.hpSl.value === 42 && cheatsSlider && cheatsSlider.value === 42);

    // the widget->store direction, through the slider's REAL loud verb: the old form
    // synthesized the change event, which writes the store while the slider itself
    // never moves - the widget half of the round trip went unmeasured
    hand.hpSl.setValue(80, { silent: false });
    await wait(60);
    ok('a loud slider commit moves the slider AND writes the model, and the vessel follows',
      hand.hpSl.value === 80 && store.get('player.hp') === 80 && vessel.hp.value === 80);

    // the devtools-merge justification, finally covered: the console's commands write
    // the STORE. Mounted and driven only under ASSERT (a dev console is summoned
    // chrome - the resting frame stays baseline-identical), through the console's own
    // verb (exec), never a synthetic store write.
    con.open();
    await wait(120);
    const hpBefore = store.get('player.hp');
    con.exec('gold 500');
    con.exec('hurt 10');
    await wait(60);
    const goldLanded = store.get('gold') === 500 && String(vessel.gold._text ?? '').includes('500');
    const hurtLanded = store.get('player.hp') === Math.max(0, hpBefore - 10);
    con.close();
    await wait(120);
    ok('the console\'s commands write the store and the bound vessel follows',
      goldLanded && hurtLanded && con.isOpen === false);

    // bindEnabled gates the hand's edit rows
    store.set('ui.edits', false);
    await wait(60);
    const sealed = hand.hpSl.disabled === true && hand.mpSl.disabled === true && hand.nameField.disabled === true;
    store.set('ui.edits', true);
    await wait(60);
    ok('bindEnabled seals and releases the edit rows',
      sealed && hand.hpSl.disabled === false && hand.nameField.disabled === false);

    // the drain mutates the model from the game's side
    const hp0 = store.get('player.hp');
    store.set('cheats.drain', true);
    await wait(1300);
    store.set('cheats.drain', false);
    ok('the drain ticks the model from the game\'s side', store.get('player.hp') < hp0);

    // the F2 hotkey rides the bus; the header click collapses
    const openH = cheats.h;
    engine.bus.emit('keydown', { key: 'F2' });
    const hidden = cheats.visible === false;
    engine.bus.emit('keydown', { key: 'F2' });
    cheats.setCollapsed(true);
    const shut = cheats.h < openH && cheats.body.visible === false;
    cheats.setCollapsed(false);
    ok('F2 recalls the cheats window and the header collapse folds it',
      hidden && cheats.visible === true && shut && cheats.h === openH);

    // the ledger round-trips the managed layout through localStorage
    const vx = vessel.win.x, vy = vessel.win.y;
    ledger.save();
    vessel.win.setPos(vx + 60, vy + 40);
    // the displacement PRECONDITION: if the setPos were clamped or
    // ignored, "returned" was true with load() doing nothing
    const moved320 = vessel.win.x === vx + 60 && vessel.win.y === vy + 40;
    ledger.load();
    await wait(60);
    const returned = vessel.win.x === vx && vessel.win.y === vy;
    localStorage.removeItem(LAYOUT_KEY);
    ok('the ledger round-trips the window layout (a move that truly moved)', moved320 && returned);

    // the page audits clean on every rule
    await wait(200);
    const cts = runAudit(engine).counts;
    ok('the page audits clean on every rule',
      Object.values(cts).reduce((a, b) => a + b, 0) === 0);

    // the ground circle: right-click on the bench opens the wheel, and
    // the nested Full Heal pick writes the ONE store every binding hears
    store.set('player.hp', 40);
    engine.bus.emit('pointerdown', { x: 640, y: 620, button: 2, pointerId: 66, target: null, native: null });
    await wait(60);
    ok('ground: a right-click on the bench opens the wheel',
      window.__binding.ground().isOpen === true);
    window.__binding.ground()._setIndex(1, false); // Cheats
    window.__binding.ground().onActivate();
    await wait(40);
    window.__binding.ground()._setIndex(0, false); // Full Heal
    window.__binding.ground().onActivate();
    await wait(60);
    ok('ground: the nested Full Heal pick writes the store the bindings hear',
      window.__binding.ground().isOpen === false && store.get('player.hp') === 100);

    ok('the whole bench ran without a single page error', window.__errs.length === 0);

    const pre = document.createElement('pre');
    pre.id = 'results';
    pre.style.cssText = 'position:fixed;left:8px;top:8px;color:#8fe8a8;background:rgba(0,0,0,0.85);padding:8px;font:11px Consolas,monospace;z-index:100;margin:0;';
    pre.textContent = results.join('\n');
    document.body.appendChild(pre);
    document.title = `BINDING ASSERT ${fails === 0 ? 'PASS' : 'FAIL'} ${results.length - fails}/${results.length}`;
  })();
} else {
  setTimeout(() => {
    document.title = window.__errs.length
      ? 'FAIL ' + String(window.__errs[0]).slice(0, 80)
      : 'BINDING READY';
  }, 1000);
}
</script>
</body>
</html>
