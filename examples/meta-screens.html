<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LovecraftUI — Meta Screens</title>
<!-- @demo   Thresholds: the full first-and-last-five-minutes flow — title menu, saves, difficulty, pause, level select, credits — at the top of a drowned harbour stair.
     @shows  MenuScreen, MenuList, TitleCard, SaveSlotList, LevelSelectGrid, CreditsScroller, RadialMenu, EldWindow, EldPopup, EldToast, Button, TextNode, UINode, QuadNode
     @params ?freeze=1 — bit-stable snapshot boot (no ambiance, no boot card) · ?assert=1 — the in-page suite titles its own PASS count -->

<!-- the proof page (the design requirement's proof at size): one state machine walks
     the whole meta-flow, keyboard and gamepad operable end to end. Title menu (with
     a Difficulty SUBMENU riding the Escape stack) → the save picker (delete
     confirms; the empty vessel begins anew) → a TitleCard announces the descent →
     "in game" (Escape pauses into a fresh MenuScreen; Quit confirms) → level select
     (locked plates refuse politely, done plates wear stars, pages turn) → credits
     (Escape or the button skips). SEQUENCED THE BOOT: the card resolves BEFORE
     the menu mounts (they used to mount together and overlap during the fade — the
     census's catalogued 1024 echo); FROZEN/ASSERT skip the card entirely. -->
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060a}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<script>
window.__errs = [];
window.addEventListener('error', (e) => { window.__errs.push(e.message); document.title = 'ERROR@' + String(e.message).slice(0, 80); });
window.addEventListener('unhandledrejection', (e) => { window.__errs.push(String(e.reason)); document.title = 'ERROR@' + String(e.reason).slice(0, 80); });
const __consoleError = console.error.bind(console);
console.error = (...a) => { window.__errs.push(a.join(' ')); __consoleError(...a); };
</script>
<script type="module">
import * as THREE from 'three';
import {
  Eldritch, EldWindow, EldPopup, EldToast, EldTooltip,
  MenuScreen, MenuList, TitleCard, SaveSlotList, LevelSelectGrid, CreditsScroller,
  RadialMenu, Button, IconButton, UINode, QuadNode, TextNode,
  runAudit, hitTest, COLORS, FONTS,
} from '../src/lovecraft-ui.js';

const params = new URLSearchParams(location.search);
const FROZEN = params.has('freeze');
const ASSERT = params.has('assert');
// INSTRUMENTED: the beacon below turns on a clock, and ?audit=1 / ?torture=1 /
// ?resize=1 are wired inside Eldritch.init - a page never sees them go by.
const INSTRUMENTED = FROZEN || ASSERT
  || params.has('audit') || params.has('torture') || params.has('resize');
Eldritch.init(FROZEN || ASSERT
  ? { background: false, vignette: false, timerDriven: true, contextMenu: false }
  : { contextMenu: false }); // the ground circle rides right-click
const engine = Eldritch.engine;

// ---- the icon pack (optional download): the RE-SKIN idiom ----
// `as:` points at icon ids this page ALREADY uses, so the registry re-bakes those NAMES
// in place: every live quad follows with no page code and no atlas movement.
// `fallback: 'none'` leaves the procedural art standing when assets/ is absent, which is
// the shipped default - the pack is an optional download and the page must not need it.
// Skipped under FROZEN: --screenshot captures at the load event and cannot wait for an
// async decode, so frozen baselines run on the procedural art by necessity.
if (!FROZEN) {
  Eldritch.loadIcons({
    base: '../assets/icons', fallback: 'none',
    icons: [
      { id: 'ico-3649', as: 'book' },
      { id: 'ico-0210', as: 'shield' },
      { id: 'ico-0513', as: 'sword' },
      { id: 'ico-0489', as: 'blindinglight' },
      { id: 'ico-0707', as: 'arrows' },
      { id: 'ico-0307', as: 'leafs' },
      { id: 'ico-0394', as: 'deathkiss' },
      { id: 'ico-0017', as: 'fireball' },
      { id: 'ico-0078', as: 'fireball2' },
    ],
  });
}

window.engine = engine;

const shadow = { color: 'rgba(0,0,0,0.85)', dx: 1, dy: 1, blur: 2 };

// ---- the drowned harbour: ONE page-owned canvas, registry-free ----
// A title screen is judged against what it stands over, and this one stood over
// nothing: five stone buttons on #04060a. The flow below is unchanged - it is a good
// state machine - but it now happens at the top of the stair it keeps talking about,
// looking down at the water it keeps promising.
const harbour = new UINode({ name: 'drowned-harbour' });
const hCanvas = document.createElement('canvas');
const hTex = new THREE.CanvasTexture(hCanvas);
hTex.colorSpace = THREE.SRGBColorSpace;
hTex.minFilter = THREE.LinearFilter;
hTex.magFilter = THREE.LinearFilter;
hTex.generateMipmaps = false;
const hQuad = new QuadNode({ texture: hTex });
harbour.add(hQuad);
engine.layers.background.add(harbour);
harbour.on('dispose', () => hTex.dispose());
const srnd = (n) => { let s = n; return () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; };

let beacon = 0.72; // the light's bearing, in turns

function paintHarbour() {
  const W = Math.max(2, Math.round(engine.width)), H = Math.max(2, Math.round(engine.height));
  if (hCanvas.width !== W || hCanvas.height !== H) { hCanvas.width = W; hCanvas.height = H; }
  const ctx = hCanvas.getContext('2d');
  const sea = Math.round(H * 0.46);          // the painted horizon; everything agrees with it

  // sky: a low overcast that never quite reaches black at the waterline
  const sky = ctx.createLinearGradient(0, 0, 0, sea);
  sky.addColorStop(0, '#05080c');
  sky.addColorStop(0.72, '#0a1118');
  sky.addColorStop(1, '#121d24');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, sea);

  // the water, darker than the sky it reflects
  const water = ctx.createLinearGradient(0, sea, 0, H);
  water.addColorStop(0, '#0d161b');
  water.addColorStop(0.5, '#070d11');
  water.addColorStop(1, '#04080a');
  ctx.fillStyle = water;
  ctx.fillRect(0, sea, W, H - sea);

  // the far shore: one flat band of teeth, no detail - it is miles off
  const r = srnd(3313);
  ctx.fillStyle = '#070b0e';
  ctx.beginPath();
  ctx.moveTo(0, sea);
  for (let x = 0; x <= W; x += 34) ctx.lineTo(x, sea - 4 - r() * 16);
  ctx.lineTo(W, sea); ctx.closePath(); ctx.fill();

  // the beacon on the point, and its beam across the water
  const bx = Math.round(W * 0.78), by = sea - 58;
  // A lighthouse turns in the HORIZONTAL plane, and from the shore you see that
  // edge-on: the beam stays near the waterline and brightens as it comes round. A full
  // 360 rotation in the picture plane just points a searchlight at the clouds.
  const turn = Math.sin(beacon * Math.PI * 2);
  const ang = Math.PI + turn * 0.30;
  const reach = Math.max(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(bx, by);
  ctx.rotate(ang);
  const lit = 0.10 + 0.14 * (0.5 + 0.5 * Math.cos(beacon * Math.PI * 2));
  const beam = ctx.createLinearGradient(0, 0, reach, 0);
  beam.addColorStop(0, `rgba(126,232,170,${lit.toFixed(3)})`);
  beam.addColorStop(0.45, `rgba(126,232,170,${(lit * 0.26).toFixed(3)})`);
  beam.addColorStop(1, 'rgba(126,232,170,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(0.055) * reach, Math.sin(0.055) * reach);
  ctx.lineTo(Math.cos(-0.055) * reach, Math.sin(-0.055) * reach);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#060a0c';
  ctx.fillRect(bx - 9, by, 18, 58);
  ctx.fillStyle = 'rgba(126,232,170,0.55)';
  ctx.fillRect(bx - 4, by + 3, 8, 8);

  // The beacon's own smear on the water, always straight down toward the viewer. It
  // must WIDEN as it comes: a constant-width rect with hard sides reads as a pillar
  // standing in the harbour, not as light lying on it.
  const smear = ctx.createLinearGradient(bx, sea, bx, H);
  smear.addColorStop(0, 'rgba(126,232,170,0.13)');
  smear.addColorStop(0.55, 'rgba(126,232,170,0.045)');
  smear.addColorStop(1, 'rgba(126,232,170,0)');
  ctx.fillStyle = smear;
  ctx.beginPath();
  ctx.moveTo(bx - 10, sea);
  ctx.lineTo(bx + 10, sea);
  ctx.lineTo(bx + 96, H);
  ctx.lineTo(bx - 96, H);
  ctx.closePath();
  ctx.fill();

  // swell: flat strokes that lengthen and spread toward the viewer, so the plane
  // agrees with the painted horizon instead of floating over it
  const s = srnd(6421);
  ctx.lineCap = 'round';
  for (let i = 0; i < 90; i++) {
    const k = s();
    const y = sea + Math.pow(k, 1.9) * (H - sea);
    const len = 12 + Math.pow(k, 1.6) * 130;
    const x = s() * (W + 200) - 100;
    ctx.strokeStyle = `rgba(150,182,178,${0.03 + k * 0.055})`;
    ctx.lineWidth = 1 + k * 1.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }

  // The broken jetty, walking out from the left into water that has taken it. Pilings
  // ALONE read as a picket fence (the tree-spike lesson) - what makes it a jetty
  // is the DECK they carry, and the fact that the deck stops before the pilings do.
  const jetty = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    jetty.push({ x: 40 + t * (W * 0.44), y: sea + (H - sea) * (0.30 + t * 0.30), t });
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  for (const p of jetty) {
    if (p.t > 0.72 && Math.round(p.t * 10) % 2) continue;   // the far pilings are gone
    ctx.lineWidth = 5 + p.t * 6;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + 24 + p.t * 40); ctx.stroke();
  }
  // the deck: two rails over the near pilings, ending in a broken lip
  const deck = jetty.filter((p) => p.t <= 0.62);
  for (const [dy, wdt, tone] of [[0, 7, 'rgba(20,26,22,0.95)'], [-7, 2, 'rgba(84,96,86,0.22)']]) {
    ctx.strokeStyle = tone;
    ctx.lineWidth = wdt;
    ctx.beginPath();
    deck.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y + dy) : ctx.moveTo(p.x, p.y + dy)));
    ctx.stroke();
  }
  const end = deck[deck.length - 1];
  ctx.strokeStyle = 'rgba(20,26,22,0.95)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(end.x, end.y - 8); ctx.lineTo(end.x + 16, end.y + 5); ctx.stroke();

  // the top of the descending stair, in the near foreground: the threshold itself
  const st = Math.round(H * 0.855);
  ctx.fillStyle = '#0a0e0c';
  ctx.fillRect(0, st, W, H - st);
  for (let i = 0; i < 4; i++) {
    const y = st + i * Math.round((H - st) / 4);
    ctx.fillStyle = `rgba(22,28,25,${0.9 - i * 0.14})`;
    ctx.fillRect(0, y, W, Math.round((H - st) / 4) - 3);
    ctx.strokeStyle = 'rgba(78,90,80,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
  }
  // two gate posts framing the drop, cut off by the sill
  ctx.fillStyle = '#0b100e';
  ctx.fillRect(Math.round(W * 0.055), st - 96, 34, 96);
  ctx.fillRect(Math.round(W * 0.905), st - 96, 34, 96);
  ctx.strokeStyle = 'rgba(78,90,80,0.13)';
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.round(W * 0.055) + 0.5, st - 95.5, 33, 95);
  ctx.strokeRect(Math.round(W * 0.905) + 0.5, st - 95.5, 33, 95);

  // rain, only where the light can find it
  const rn = srnd(1187);
  ctx.strokeStyle = 'rgba(174,196,190,0.055)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 130; i++) {
    const x = rn() * W, y = rn() * H;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 13); ctx.stroke();
  }

  hTex.needsUpdate = true;
}
// ZERO-SIZED wrapper: a sized full-screen node overlaps every sibling in the census.
harbour.onLayout = function () {
  hQuad.setRect(0, 0, Math.round(engine.width), Math.round(engine.height));
  paintHarbour();
};
// The one loop that runs without being poked. Repaint is throttled to ~8Hz because the
// whole harbour is one canvas; the census boots see a still light.
if (!INSTRUMENTED) {
  let acc = 0;
  engine.ticker.add((dt) => {
    acc += dt;
    if (acc < 0.125) return;
    beacon = (beacon + acc * 0.018) % 1;
    acc = 0;
    paintHarbour();
    engine.requestRender();
  });
}
let difficulty = 'Fair';
let current = null;   // the live screen node (MenuScreen or EldWindow)
let offPause = null;  // the in-game Escape hook

const clear = () => {
  if (offPause) { offPause(); offPause = null; }
  if (current && !current.disposed) {
    if (current.close) current.close();
    else current.dispose();
  }
  current = null;
};

// ---- the way back: a gear that answers the empty stage ----
// Closing any of the flow's windows by its own X strands the player on the bare
// harbour with no visible door (Escape only pauses IN game, and nothing says so).
// The gear stands top-right whenever no menu screen is up and the stage is
// otherwise empty — and in game, where it opens the held breath the way any
// settings button would. While a menu, a picker, or a card presents, it yields.
let cardUp = false;
const hatch = new IconButton('cogwheel', { onClick: () => {
  if (current && !current.disposed && current.id === 'game') pauseMenu(current);
  else titleMenu();
} });
hatch.visible = false; // the boot decides; never a pre-boot flash
EldTooltip.attach(hatch, { title: 'Menu', desc: 'Return to the menu.' });
engine.layers.windows.add(hatch);
hatch.onLayout = function () { this.setPos(engine.width - this.w - 12, 12); };
const screenUp = () => engine.layers.overlay.children.some((n) => n instanceof MenuScreen && !n.disposed);
function hatchCheck() {
  hatch.visible = !cardUp && !screenUp()
    && (current == null || current.disposed || current.id === 'game');
}
// Every window the flow builds reports its own death (the X, Escape, anything):
// the stage recomputes, and the game window releases its Escape hook — a pause
// summoned over a dead window is worse than none.
function watch(node) {
  node.on('dispose', () => {
    if (node.id === 'game' && offPause) { offPause(); offPause = null; }
    if (current === node) current = null;
    hatchCheck();
  });
  hatchCheck();
  return node;
}

// ---- the states ----
const LEVELS = Array.from({ length: 12 }, (_, i) => ({
  id: i + 1, label: 'IVXLCDM'[i % 7] + (i + 1),
  state: i < 4 ? 'done' : i < 8 ? 'open' : 'locked',
  stars: i < 4 ? (i % 3) + 1 : 0,
}));

function titleMenu() {
  clear();
  const ms = new MenuScreen({
    title: 'THRESHOLDS',
    // A title screen has nothing behind it to seal, so its veil is thin enough to let
    // the harbour through. The pause menu below keeps the 0.88 default, because THAT
    // one is sealing a game in progress - which is the whole point of a pause menu.
    scrimOpacity: 0.34,
    items: [
      { label: 'New Game', onSelect: () => savePicker() },
      { label: 'Difficulty', onSelect: () => ms.push({
        title: 'Difficulty',
        items: ['Merciful', 'Fair', 'Merciless'].map((d) => ({
          label: d,
          onSelect: () => {
            difficulty = d;
            EldToast.show({ title: 'The Deep Adjusts', message: d, icon: 'book', duration: 2 });
            ms.pop();
          },
        })),
      }) },
      { label: 'Level Select', onSelect: () => levelSelect() },
      { label: 'Credits', onSelect: () => credits() },
      { label: 'Continue', disabled: true, reason: 'No vessel remembered — begin anew.' },
    ],
  });
  engine.layers.overlay.add(ms);
  current = ms;
  ms.on('dispose', hatchCheck);
  hatchCheck();
}

let saveList = null;
function savePicker() {
  clear();
  let slots = [
    { name: 'Ilse of the Quay', timestamp: 'the 3rd bell, yesterday', playtime: '4h 12m' },
    { name: 'The Unnamed Keeper', timestamp: 'a fortnight past', playtime: '11h 03m' },
    null,
  ];
  // The list and the Back button are built FIRST so the window height DERIVES
  // from them: the old 460x340 hand-measured Back at y=262 against a
  // computed 236px list — 300px of content in a 288px box, a 12px scrollbar
  // over nothing at rest (the inverse face of the dead-band class).
  const list = new SaveSlotList({
    slots, width: 420,
    onSelect: () => descend(),
    onNew: () => descend(),
    onDelete: (i) => { slots = slots.filter((_, k) => k !== i); list.setSlots(slots); },
  });
  const back = new Button('Back', { minWidth: 100 });
  const winH = 36 + 6 + list.h + 12 + back.h + 8 + 16; // header+top | list | gap | Back | breathing | frame
  const win = EldWindow.create({
    id: 'saves', title: 'Choose a Vessel', width: 460, height: winH, minWidth: 460, minHeight: 300, x: 0, y: 0, transitions: true,
    content: (c) => {
      saveList = list;
      list.setPos(10, 6);
      c.add(list);
      back.setPos(10, 6 + list.h + 12);
      back.on('click', () => titleMenu());
      c.add(back);
      // Back rides the LIST bottom: deleting a vessel shrinks the list and the
      // seat follows (the hand-measured y=262 could not)
      const lay = c.onLayout?.bind(c);
      c.onLayout = function () { lay?.(); back.setPos(10, list.y + list.h + 12); };
    },
  });
  win.setRect(Math.round((engine.width - win.w) / 2), Math.round((engine.height - win.h) / 2), win.w, win.h);
  current = win;
  watch(win);
}

async function descend() {
  clear();
  cardUp = true; hatchCheck(); // a card is a presence: the way back yields to it
  await TitleCard.show({ title: 'THE DESCENT BEGINS', subtitle: difficulty + ' waters', hold: 1.1 });
  cardUp = false;
  inGame();
}

function inGame() {
  clear();
  // 180 tall, not 200: one placeholder line fits in far less, but 180 is the
  // library's resize floor (METRICS.windowMinH) — declaring below it invites the
  // grip-snap jump; the honest minimum for a window this empty IS the floor
  const win = EldWindow.create({
    id: 'game', title: 'The Depths (pretend)', width: 420, height: 180, x: 0, y: 0,
    content: (c) => {
      const t = new TextNode('You are "in game." The abyss is patient.', {
        size: 13, color: COLORS.text, multiline: true, maxWidth: 380, shadow,
      });
      t.setPos(12, 12);
      c.add(t);
    },
  });
  win.setRect(Math.round((engine.width - win.w) / 2), Math.round((engine.height - win.h) / 2), win.w, win.h);
  current = win;
  watch(win);
  offPause = engine.focus.pushEscape(() => pauseMenu(win));
}

function pauseMenu(gameWin) {
  if (offPause) { offPause(); offPause = null; }
  const ms = new MenuScreen({
    title: 'A HELD BREATH',
    items: [
      { label: 'Resume', onSelect: () => { ms.dispose(); current = gameWin; offPause = engine.focus.pushEscape(() => pauseMenu(gameWin)); } },
      { label: 'Level Select', onSelect: () => { ms.dispose(); levelSelect(); } },
      { label: 'Quit to Title', onSelect: () => {
        EldPopup.show({
          title: 'Abandon the Depths',
          message: 'Quit to the title? The abyss remembers.',
          onOkay: () => { ms.dispose(); titleMenu(); },
        });
      } },
    ],
  });
  engine.layers.overlay.add(ms);
  ms.on('dispose', hatchCheck);
  hatchCheck();
  return ms;
}

const onLevelPick = async (e) => {
  if (e.state === 'locked') {
    EldToast.show({ title: 'Sealed', message: 'The stair does not yet descend so far.', duration: 2 });
    return;
  }
  clear();
  cardUp = true; hatchCheck();
  await TitleCard.show({ title: 'STAIR ' + e.id, subtitle: e.state === 'done' ? 'again, deeper' : 'untrodden stone', hold: 1 });
  cardUp = false;
  inGame();
};

let levelGrid = null;
function levelSelect() {
  clear();
  // Grid and Back built FIRST so the height DERIVES from them — the
  // old 340 hand-measured Back at y=246 against the grid's computed height,
  // four pixels from arming a scrollbar (the saves window's exact failure).
  const grid = new LevelSelectGrid({
    levels: LEVELS, cols: 4, pageSize: 8,
    onSelect: onLevelPick,
  });
  const back = new Button('Back', { minWidth: 100 });
  const winH = 36 + 6 + grid.h + 12 + back.h + 8 + 16;
  const win = EldWindow.create({
    id: 'levels', title: 'The Descending Stair', width: 380, height: winH, minWidth: 380, minHeight: 300, x: 0, y: 0, transitions: true,
    content: (c) => {
      grid.setPos(10, 6);
      c.add(grid);
      levelGrid = grid;
      back.setPos(10, 6 + grid.h + 12);
      back.on('click', () => titleMenu());
      c.add(back);
      // the pager can change the grid's height page to page — the seat follows
      const lay = c.onLayout?.bind(c);
      c.onLayout = function () { lay?.(); back.setPos(10, grid.y + grid.h + 12); };
    },
  });
  win.setRect(Math.round((engine.width - win.w) / 2), Math.round((engine.height - win.h) / 2), win.w, win.h);
  current = win;
  watch(win);
}

let creditsRoll = null;
function credits() {
  clear();
  const win = EldWindow.create({
    id: 'credits', title: 'Credits', width: 460, height: 360, minWidth: 460, minHeight: 300, x: 0, y: 0, transitions: true,
    content: (c, winRef) => {
      const roll = new CreditsScroller({
        width: 420, height: 250, speed: 30,
        entries: [
          { header: 'THRESHOLDS' },
          { text: 'a meta-screens demonstration' },
          { header: 'The Keepers' },
          { role: 'Harbor-Master', name: 'Ilse of the Quay' },
          { role: 'Cartographer', name: 'The Unnamed' },
          { role: 'Bell-Ringer', name: 'Third of Nine' },
          { header: 'The Instruments' },
          { role: 'Stone', name: 'cut by the seeded generator' },
          { role: 'Light', name: 'verdigris, sparingly' },
          { text: 'No assets were shipped in the making of this interface.' },
        ],
      });
      roll.setPos(4, 6);
      c.add(roll);
      creditsRoll = roll;
      roll.on('done', () => EldToast.show({ title: 'The Roll Ends', duration: 2 }));
      const skip = new Button('Skip', { minWidth: 100 });
      skip.setPos(10, 266);
      skip.on('click', () => roll.skip());
      c.add(skip);
      const back = new Button('Back to Title', { minWidth: 150 });
      back.setPos(120, 266);
      back.on('click', () => titleMenu());
      c.add(back);

      // ANCHOR the roll and the button row to the window's LIVE content box.
      //
      // Two reported defects, one cause. The roll was a fixed 420x250 at x=10, so
      // (a) resizing the window moved the frame and left a static box sitting in the
      // corner, and (b) 10 + 420 = 430 sat about four pixels past a ~426px content box.
      // That is real overflow, so the rail rested SHOWN — correctly — for content nobody
      // could see was cut. The rail was telling the truth; the layout was the lie.
      // The rich-text laneColumn idiom: WRAP the content node's onLayout, never replace
      // it (replacing it piles the window's own children at 0,0).
      const lay = c.onLayout?.bind(c);
      c.onLayout = function () {
        lay?.();
        const bw = Math.max(120, winRef.contentArea.boxW - 8);
        // the button lane DERIVES from the real button height: the old
        // constant 44 assumed a 30px button — Button stands 38, so the window
        // booted 8px overflowed and a rail rested on the buttons' clipped feet
        const btnH = Math.max(skip.h, back.h);
        const bh = Math.max(80, winRef.contentArea.boxH - (6 + 8 + btnH + 8));
        if (roll.w !== bw || roll.h !== bh) roll.setRect(4, 6, bw, bh);
        const by = 6 + bh + 8;
        skip.setPos(4, by);
        back.setPos(4 + skip.w + 10, by);
      };
    },
  });
  win.setRect(Math.round((engine.width - 460) / 2), Math.round((engine.height - 360) / 2), 460, 360);
  current = win;
  watch(win);
}

// ---- boot: the card resolves, THEN the menu mounts (they used to mount together
// and overlap during the fade — the census's catalogued 1024 echo). FROZEN/ASSERT
// skip the card: a static boot needs no announcement (the rule). ----
if (FROZEN || ASSERT) {
  titleMenu();
} else {
  cardUp = true;
  TitleCard.show({ title: 'THRESHOLDS', subtitle: 'the first and last five minutes', hold: 1.2 }).then(() => { cardUp = false; titleMenu(); });
}

window.__meta = { cur: () => current, savePicker, levelSelect, credits, descend, pauseMenu, onLevelPick, hatch };

// ---- the ground circle: right-click on the harbour night opens the
// screens wheel — the same doors the title menu opens, reachable from any
// screen without walking back to the title first.
const ground = new RadialMenu({
 ground: true, //: the radial chain's terminus — an unconsumed right-click lands here
 items: [
 { id: 'screens', label: 'Screens', children: [
 { id: 'saves', label: 'Saves' },
 { id: 'levels', label: 'Levels' },
 { id: 'credits', label: 'Credits' },
 ] },
 { id: 'begin', label: 'Begin' },
 ],
});
const GROUND_VERBS = {
  'screens/saves': savePicker,
  'screens/levels': levelSelect,
  'screens/credits': credits,
  begin: () => { descend(); },
};
ground.on('select', ({ id, path }) => (GROUND_VERBS[path.join('/')] ?? GROUND_VERBS[id])?.());
engine.bus.on('pointerdown', (e) => {
  if (e.button !== 2 || e.target) return;
  ground.toggle(e.x, e.y);
});
window.__meta.ground = ground;

// ---- ?assert=1: the in-page suite (the whole meta-flow, driven) ----
if (ASSERT) {
  const results = [];
  let fails = 0;
  const ok = (name, cond) => { results.push(`${cond ? 'PASS' : 'FAIL'} ${name}`); if (!cond) fails++; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    await wait(500); // the title menu mounts (no boot card under ASSERT)

    // the boot scene proves its zero first (no toast or card has opened yet).
    // All six rules run; the sixth (reach) reads the title veil truthfully: a
    // MenuScreen SEALS the world below it, taskbar included — that is what a menu
    // screen is for. The torture walker's own carve-out applies verbatim (a reach
    // violation whose blocker IS the sealing surface is the seal working, not a
    // defect); a reach violation from any OTHER blocker still fails here.
    const audit = runAudit(engine);
    const vios = audit.violations.filter((v) =>
      !(v.rule === 'reach' && v.blocker && current
        && (v.blocker === current || current.isAncestorOf(v.blocker))));
    const v0 = vios[0];
    ok(`the title scene audits clean on every rule${v0 ? ` [${v0.rule} ${v0.path} ${v0.detail ?? ''}]` : ''}`,
      vios.length === 0);

    const ms = current;
    ok('the title menu stands with its five rites',
      ms && ms.list && ms.list.items.length === 5 && ms.list.items[4].disabled === true && ms.depth === 0);

    // the difficulty submenu rides the escape stack (driven through the list's own select)
    ms.list._setIndex(1); ms.list._select(); // private drive: no public verb — the model half only
    await wait(450);
    const pushed = ms.depth === 1;
    ms.list._setIndex(2); ms.list._select(); // Merciless (private drive: no public verb — the model half only)
    await wait(450);
    ok('the difficulty submenu rides the escape stack',
      pushed && difficulty === 'Merciless' && ms.depth === 0);

    // the save picker stands with its vessels
    savePicker();
    await wait(300);
    ok('the save picker stands with its vessels', saveList != null && current?.id === 'saves');
    // the derived height fits the list AND the Back button: the old
    // hand-measured 340 booted 12px overflowed — a scrollbar over nothing
    {
      const sa = current.contentArea, slack = sa.boxH - sa.contentH;
      ok(`the vessel list and Back fit the box — no rail at rest [boxH ${sa.boxH} contentH ${sa.contentH}]`,
        sa.vBarVisible === false && sa.maxScroll === 0 && slack >= 0 && slack <= 24);
    }

    // the descent announces and lands in game, with the pause hook armed
    await descend();
    await wait(300);
    ok('the descent lands in game with the pause hook armed',
      current?.id === 'game' && offPause != null);
    // the pretend-game window rests at the library's 180px floor: dead space
    // by FLOOR is design, phantom scroll range never is
    ok('the game window shows no phantom range at the library floor',
      current.contentArea.vBarVisible === false && current.contentArea.maxScroll === 0
      && current.h === 180);

    // quit asks first (the popup-gate proof), then the title returns
    const pm = pauseMenu(current);
    await wait(300);
    pm.list._setIndex(2); pm.list._select(); // Quit to Title (private drive: no public verb — the model half only)
    await wait(200);
    const gated = current?.id === 'game'; // still in game while the popup asks
    EldPopup._finish('ok'); // private drive: no public verb — the model half only
    await wait(400);
    ok('quit asks first and the title returns',
      gated && current instanceof MenuScreen && current.depth === 0);

    // locked stairs refuse politely; an open stair descends
    levelSelect();
    await wait(300);

    // the historic zero-rect bug's page-level guard was only a walked floor: measure a
    // page-1 tile's WORLD box and fire the real pointer path at its center — one probe
    // kills the zero-rect class and the scrim-blocks-tiles class together
    const tile = levelGrid.children[0]; // the first page-1 plate (plates mount before the pager)
    const tHit = hitTest(engine,
      tile.worldX + (tile.w * (tile.worldScale || 1)) / 2,
      tile.worldY + (tile.h * (tile.worldScale || 1)) / 2);
    ok('a page-1 tile stands at real size and its center answers into the grid',
      tile.w > 40 && tile.h > 40
      && (tHit === levelGrid || (levelGrid.isAncestorOf ? levelGrid.isAncestorOf(tHit) : false)));
    // the stair window's derived height fits grid AND Back (the saves law here too)
    {
      const sa = current.contentArea, slack = sa.boxH - sa.contentH;
      ok(`the stair grid and Back fit the box — no rail at rest [boxH ${sa.boxH} contentH ${sa.contentH}]`,
        sa.vBarVisible === false && sa.maxScroll === 0 && slack >= 0 && slack <= 24);
    }

    const toasts0 = EldToast.live.length;
    onLevelPick({ id: 9, state: 'locked' }); // callback drive: the locked MODEL branch
    await wait(200);
    const refused = EldToast.live.length === toasts0 + 1 && current?.id === 'levels';

    // one real pick through the grid's own plumbing: a canvas pointer pair at an OPEN
    // tile's center walks hitTest → the plate's click → the grid's `levelclick` → the
    // page callback — the path a player takes (dispatch alone would bypass all of it)
    const openTile = levelGrid.children[4]; // LEVELS[4] is an 'open' stair on page 1
    let picked = null;
    levelGrid.on('levelclick', (e) => { picked = e; });
    const crect = engine.canvas.getBoundingClientRect();
    const pOpts = {
      clientX: crect.left + openTile.worldX + openTile.w / 2,
      clientY: crect.top + openTile.worldY + openTile.h / 2,
      button: 0, pointerId: 61, bubbles: true,
    };
    engine.canvas.dispatchEvent(new PointerEvent('pointerdown', pOpts));
    engine.canvas.dispatchEvent(new PointerEvent('pointerup', pOpts));
    await wait(80);
    ok('a real click at the tile commits the grid\'s own levelclick',
      picked != null && picked.id === 5 && picked.state === 'open');
    await wait(2000); // the pick's title card holds 1s, then the game mounts
    ok('locked stairs refuse and an open stair descends',
      refused && current?.id === 'game');

    // the credits roll skips to its end
    credits();
    await wait(300);
    const toasts1 = EldToast.live.length;
    creditsRoll.skip();
    await wait(250);
    // the ROLL is the property: the toast proved only the page's done
    // wiring — the widget's own offset must have landed at the end
    ok('the credits roll skips to its end (the roll itself landed)',
      EldToast.live.length === toasts1 + 1
      && creditsRoll._done === true && creditsRoll._offset >= creditsRoll._endOffset);
    // the credits window anchors its roll to the LIVE box — hold that
    // truth against the dead-band class: no armed range, ever, at boot size
    ok('the credits window arms no scroll range at its boot size',
      current.contentArea.vBarVisible === false && current.contentArea.maxScroll === 0);

    // the ground circle: the wheel reaches the save picker from ANY
    // screen through the same door the title menu opens
    engine.bus.emit('pointerdown', { x: 640, y: 200, button: 2, pointerId: 99, target: null, native: null });
    await wait(60);
    ok('ground: a right-click on the harbour opens the screens wheel',
      window.__meta.ground.isOpen === true);
    window.__meta.ground._setIndex(0, false); // Screens
    window.__meta.ground.onActivate();
    await wait(40);
    window.__meta.ground._setIndex(0, false); // Saves
    window.__meta.ground.onActivate();
    await wait(300);
    ok('ground: the nested Saves pick lands the save picker',
      window.__meta.ground.isOpen === false && current?.id === 'saves');

    // the way back (the empty-stage rule): it yields behind every surface, stands
    // when the stage empties, and is state-true about which door it opens
    const gear = window.__meta.hatch;
    ok('way back: the gear yields while the save picker stands', gear.visible === false);
    current.close();
    await wait(400); // the transition fade releases the stage
    const stoodEmpty = gear.visible === true;
    gear.dispatch('click', {});
    await wait(300);
    ok('way back: an X-closed picker summons the gear, and the gear answers with the title',
      stoodEmpty && current instanceof MenuScreen && gear.visible === false);
    await descend();
    await wait(300);
    const inGameGear = gear.visible === true && current?.id === 'game';
    gear.dispatch('click', {});
    await wait(300);
    const pauseUp = engine.layers.overlay.children.find((n) => n instanceof MenuScreen && !n.disposed);
    ok('way back: in game the gear holds the breath (the settings door)',
      inGameGear && pauseUp != null && gear.visible === false);
    pauseUp.list._setIndex(0); pauseUp.list._select(); // Resume (private drive: the model half)
    await wait(300);
    current.close();
    await wait(400);
    const freedGear = gear.visible === true && offPause == null;
    gear.dispatch('click', {});
    await wait(300);
    ok('way back: a closed game window frees its Escape hook and the gear returns the title',
      freedGear && current instanceof MenuScreen && gear.visible === false);

    ok('the whole flow ran without a single page error', window.__errs.length === 0);

    const pre = document.createElement('pre');
    pre.id = 'results';
    pre.style.cssText = 'position:fixed;left:8px;top:8px;color:#8fe8a8;background:rgba(0,0,0,0.85);padding:8px;font:11px Consolas,monospace;z-index:100;margin:0;';
    pre.textContent = results.join('\n');
    document.body.appendChild(pre);
    document.title = `METASCREENS ASSERT ${fails === 0 ? 'PASS' : 'FAIL'} ${results.length - fails}/${results.length}`;
  })();
} else {
  setTimeout(() => {
    document.title = window.__errs.length
      ? 'FAIL ' + String(window.__errs[0]).slice(0, 80)
      : 'METASCREENS READY';
  }, 1000);
}
</script>
