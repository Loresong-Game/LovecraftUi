<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LovecraftUI — Theme Gallery</title>
<!-- @demo   Many Skins: the shipped presets (Verdigris, Brass, Aether) at four couch-distance scales, with a live token diff and photo-mode hiding.
     @shows  Eldritch, brass, aether, EldWindow, SegmentedControl, Button, TextField, ToggleLabel, Slider, Select, ProgressBar, KeyGlyph, ActionSlot, RadialMenu, TextNode, UINode, QuadNode, COLORS, FONTS
     @params ?theme=brass|aether (boot straight into a preset) · ?scale=1.25|1.5|2 (boot at a uiScale step) · ?freeze=1 — bit-stable snapshot boot · ?assert=1 — the in-page suite titles its own PASS count -->

<!-- the proof page: the preset switcher tears the engine down and reboots it
     with the chosen theme + uiScale (the re-theme policy: destroy + init). The
     widget wall re-cuts per theme, the KeyGlyph row re-bakes, the token readout
     diffs the preset against stock, and Photo Mode hides everything except the
     framing grid for a beat. -->
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060a}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<script>
window.__errs = [];
window.addEventListener('error', (e) => { window.__errs.push(e.message); document.title = 'ERROR@' + String(e.message).slice(0, 80); });
window.addEventListener('unhandledrejection', (e) => { window.__errs.push(String(e.reason)); document.title = 'ERROR@' + String(e.reason).slice(0, 80); });
const __consoleError = console.error.bind(console);
console.error = (...a) => { window.__errs.push(a.join(' ')); __consoleError(...a); };
</script>
<script type="module">
import {
  Eldritch, EldWindow, SegmentedControl, Button, TextField, ToggleLabel, Slider, Select,
  ProgressBar, KeyGlyph, ActionSlot, RadialMenu, TextNode, UINode, QuadNode, runAudit, COLORS, FONTS, brass, aether,
} from '../src/lovecraft-ui.js';

const STOCK = { ...COLORS }; // snapshot before any theme mutates the live table
const PRESETS = { verdigris: null, brass, aether };
const q = new URLSearchParams(location.search);
const FROZEN = q.has('freeze');
const ASSERT = q.has('assert');
let themeName = PRESETS[q.get('theme')] !== undefined && q.get('theme') ? q.get('theme') : 'verdigris';
let uiScale = [1, 1.25, 1.5, 2].includes(parseFloat(q.get('scale'))) ? parseFloat(q.get('scale')) : 1;

// ---- the custom cut (absorbed from the retired theming.html) ----
// It lives OUTSIDE boot() because a re-theme is destroy + init: the edits have to
// survive the reboot that applies them. Overrides layer ON TOP of whichever preset
// is picked, so the two halves of theming compose instead of competing - which is
// the thing neither page could show alone.
const EDITABLE = [
  ['accent', 'Accent'],
  ['stoneMid', 'Stone mid'],
  ['moss', 'Moss'],
  ['panel', 'Panel'],
];
let custom = { colors: {}, seedOffset: 0 };
function mergedTheme() {
  const preset = PRESETS[themeName];
  const hasCustom = Object.keys(custom.colors).length > 0 || custom.seedOffset !== 0;
  if (!preset && !hasCustom) return null;
  return {
    ...(preset ?? {}),
    colors: { ...(preset?.colors ?? {}), ...custom.colors },
    seeds: { ...(preset?.seeds ?? {}), offset: (preset?.seeds?.offset ?? 0) + custom.seedOffset },
  };
}
function snippet() {
  const t = mergedTheme();
  if (!t) return 'Eldritch.init()';
  const shown = { colors: { ...custom.colors } };
  if (custom.seedOffset) shown.seeds = { offset: custom.seedOffset };
  const base = themeName === 'verdigris' ? '' : `...${themeName}, `;
  return `Eldritch.init({ theme: { ${base}${JSON.stringify(shown).slice(1, -1)} } })`;
}

function rebuild() {
  Eldritch.destroy();
  boot();
}

function boot() {
  const theme = mergedTheme();
  // the flags ride EVERY reboot (the theming precedent: re-init cycles must
  // keep the headless clock and quiet ambiance)
  Eldritch.init({
    ...(theme ? { theme } : {}), uiScale, contextMenu: false, // the ground circle
    ...(FROZEN || ASSERT ? { background: false, vignette: false, timerDriven: true } : {}),
  });
  const engine = Eldritch.engine;
  window.engine = engine;
  const shadow = { color: 'rgba(0,0,0,0.85)', dx: 1, dy: 1, blur: 2 };

  // ---- the knobs (rebuilding is the policy: re-theme = destroy + init) ----
  // consistency: the house page-title treatment (demo/trees set it) — size 24,
  // letterSpacing 2, title-case so smallCaps actually renders its small caps.
  const title = new TextNode('Many Skins', {
    font: FONTS.header, size: 24, smallCaps: true, letterSpacing: 2, color: COLORS.accent, shadow,
  });
  title.setPos(16, 14);
  engine.layers.background.add(title);

  const presetPick = new SegmentedControl({
    options: [
      { label: 'Verdigris', value: 'verdigris' },
      { label: 'Brass', value: 'brass' },
      { label: 'Aether', value: 'aether' },
    ],
    value: themeName, width: 300,
    onChange: (v) => { themeName = v; setTimeout(rebuild, 0); },
  });
  presetPick.setPos(16, 48);
  engine.layers.background.add(presetPick);

  const scalePick = new SegmentedControl({
    options: [
      { label: '1×', value: 1 }, { label: '1.25×', value: 1.25 },
      { label: '1.5×', value: 1.5 }, { label: '2×', value: 2 },
    ],
    value: uiScale, width: 240,
    onChange: (v) => { uiScale = v; setTimeout(rebuild, 0); },
  });
  scalePick.setPos(330, 48);
  engine.layers.background.add(scalePick);

  const scaleNote = new TextNode(
    `logical ${engine.width}×${engine.height} at uiScale ${engine.uiScale}`,
    { font: FONTS.mono, size: 11, color: COLORS.textFaint, shadow },
  );
  scaleNote.setPos(16, 84);
  engine.layers.background.add(scaleNote);

  // ---- the widget wall: one of the usual suspects per family ----
  EldWindow.create({
    title: 'The Fitting Room',
    width: 380, height: 330, x: 16, y: 110,
    content: (c) => {
      const b = new Button('Commission', {});
      b.setPos(10, 10);
      const t = new TextField({ placeholder: 'Inscription…', width: 180 });
      t.setPos(150, 12);
      const tg = new ToggleLabel('Gilded fittings', { checked: true });
      tg.setPos(12, 58);
      const sl = new Slider({ min: 0, max: 100, value: 62, width: 200 });
      sl.setPos(10, 96);
      const se = new Select({ options: ['Rivets', 'Filigree', 'Plain'], value: 'Rivets', width: 160 });
      se.setPos(10, 130);
      const pb = new ProgressBar({ value: 70, width: 320 });
      pb.setPos(10, 176);
      const slot = new ActionSlot('gallery-slot', { register: false });
      slot.setPos(10, 210);
      slot.setKeybind('Q');
      const glyphs = new UINode();
      let gx = 0;
      for (const bind of ['E', 'Ctrl+E', { pad: 'A' }, { pad: 'Y' }, { mouse: 1 }]) {
        const g = new KeyGlyph(bind, { size: 20 });
        g.setPos(gx, 0);
        glyphs.add(g);
        gx += g.w + 8;
      }
      glyphs.setPos(70, 216);
      glyphs.setSize(gx, 20);
      c.add(b, t, tg, sl, se, pb, slot, glyphs);
    },
  });

  // ---- the token diff: what this preset changes against stock ----
  const diffPane = new UINode();
  let cutting = null; // { snip, win } — the suite reads the paste line's live geometry
  // ---- The Cutting Room: token overrides + the seed scrubber + the paste line ----
  EldWindow.create({
    // 400 tall, not 330: four field rows + the seed row + the button row already run
    // to y=264, and the header plus frame insets eat ~60 - at 330 the paste line was
    // clipped and the window grew a scrollbar for it
    title: 'The Cutting Room', width: 400, height: 400, x: 762, y: 110,
    content: (c, winRef) => {
      let y = 6;
      for (const [token, label] of EDITABLE) {
        const l = new TextNode(label, { size: 12, color: COLORS.textMuted, shadow });
        l.setPos(4, y + 8);
        const f = new TextField({ value: custom.colors[token] ?? COLORS[token], width: 140 });
        f.setPos(150, y);
        f.on('change', (e) => { custom.colors[token] = e.value; });
        c.add(l, f);
        y += 42;
      }
      const sl = new TextNode('Seed offset', { size: 12, color: COLORS.textMuted, shadow });
      sl.setPos(4, y + 8);
      const seed = new Slider({
        min: 0, max: 12, step: 1, value: custom.seedOffset, width: 140,
        onChange: (v) => { custom.seedOffset = v; },
      });
      seed.setPos(150, y + 4);
      c.add(sl, seed);
      y += 46;
      // a re-theme is destroy + init by design (tokens are read at BAKE time), so the
      // apply is explicit - this button is the operation, not a driver for it
      const apply = new Button('Re-cut the Stone', { onClick: () => setTimeout(rebuild, 0) });
      apply.setPos(4, y);
      const reset = new Button('Stock', {
        onClick: () => { custom = { colors: {}, seedOffset: 0 }; setTimeout(rebuild, 0); },
      });
      reset.setPos(4 + apply.w + 8, y);
      c.add(apply, reset);
      y += 50;
      const snip = new TextNode(snippet(), {
        font: FONTS.mono, size: 10, color: COLORS.bone, shadow, multiline: true, maxWidth: 356,
      });
      snip.setPos(4, y);
      c.add(snip);
      cutting = { snip, win: winRef };
    },
  });

  diffPane.setPos(430, 110);
  engine.layers.background.add(diffPane);
  const header = new TextNode(theme ? `Token diff — ${themeName}` : 'Token diff — stock (no overrides)', {
    font: FONTS.header, size: 13, smallCaps: true, letterSpacing: 1, color: COLORS.bone, shadow,
  });
  header.setPos(0, 0);
  diffPane.add(header);
  let dy = 24;
  if (theme) {
    for (const [token, value] of Object.entries(theme.colors ?? {})) {
      if (STOCK[token] === value) continue;
      const row = new TextNode(`${token}: ${STOCK[token]} → ${value}`, {
        font: FONTS.mono, size: 11, color: COLORS.textMuted, shadow,
      });
      const chip = new QuadNode({ color: value });
      chip.setRect(0, dy + 2, 10, 10);
      row.setPos(16, dy);
      diffPane.add(chip, row);
      dy += 16;
      if (dy > 460) { const more = new TextNode('…', { size: 11, color: COLORS.textFaint }); more.setPos(16, dy); diffPane.add(more); break; }
    }
    if (theme.seeds) {
      const s = new TextNode(`seeds.offset: 0 → ${theme.seeds.offset}`, { font: FONTS.mono, size: 11, color: COLORS.textMuted, shadow });
      s.setPos(16, dy); diffPane.add(s); dy += 16;
    }
    if (theme.painters) {
      const p = new TextNode(`painters: ${Object.keys(theme.painters).join(', ')}`, { font: FONTS.mono, size: 11, color: COLORS.quest, shadow });
      p.setPos(16, dy); diffPane.add(p); dy += 16;
    }
  }
  diffPane.setSize(360, dy);

  // ---- photo mode: hide the HUD except the framing grid, then restore ----
  const photo = new Button('Photo Mode (1.5s)', {
    onClick: () => {
      const grid = new UINode({ name: 'framing-grid' });
      const W = engine.width, H = engine.height;
      for (const fx of [1 / 3, 2 / 3]) {
        const v = new QuadNode({ color: COLORS.accent, opacity: 0.35 });
        v.setRect(Math.round(W * fx), 0, 1, H);
        const hz = new QuadNode({ color: COLORS.accent, opacity: 0.35 });
        hz.setRect(0, Math.round(H * fx), W, 1);
        grid.add(v, hz);
      }
      grid.setSize(W, H);
      engine.layers.overlay.add(grid);
      Eldritch.setHUDVisible(false, { except: [grid] });
      setTimeout(() => { Eldritch.setHUDVisible(true); grid.dispose(); }, 1500);
    },
  });
  photo.setPos(16, 460);
  engine.layers.background.add(photo);

  // ---- the ground circle, built INSIDE boot(): a re-theme is
  // destroy + init, so the wheel dies and re-cuts with everything else. The
  // Preset ring drives the SAME picker the strip drives (loud — rebuild fires).
  const ground = new RadialMenu({
 ground: true, //: the radial chain's terminus — an unconsumed right-click lands here
 items: [
 { id: 'preset', label: 'Preset', children: [
 { id: 'verdigris', label: 'Verdigris' },
 { id: 'brass', label: 'Brass' },
 { id: 'aether', label: 'Aether' },
 ] },
 { id: 'photo', label: 'Photo' },
 ],
 });
  ground.on('select', ({ id, path }) => {
    if (path[0] === 'preset') presetPick.setValue(id, { silent: false });
    else if (id === 'photo') photo.dispatch('click', {});
  });
  engine.bus.on('pointerdown', (e) => {
    if (e.button !== 2 || e.target) return;
    ground.toggle(e.x, e.y);
  });

  window.__gallery = { presetPick, scalePick, photo, diffPane, cutting, ground, diffRows: dy > 24 ? Math.floor((dy - 24) / 16) : 0 };
}

boot();

// ---- ?assert=1: the in-page suite (the re-theme policy, driven) ----
if (ASSERT) {
  const results = [];
  let fails = 0;
  const ok = (name, cond) => { results.push(`${cond ? 'PASS' : 'FAIL'} ${name}`); if (!cond) fails++; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  (async () => {
    await wait(700); // the stock boot settles

    const audit = runAudit(Eldritch.engine);
    const cts = audit.counts;
    const v0 = audit.violations[0];
    ok(`the stock boot audits clean on every rule${v0 ? ` [${v0.rule} ${v0.path} ${v0.detail ?? ''}]` : ''}`,
      Object.values(cts).reduce((a, b) => a + b, 0) === 0);

    // the Cutting Room paste line (the phantom-scrollbar fix, until now unasserted):
    // the snippet ends INSIDE the window's live content box and no rail rests shown
    const cr = window.__gallery.cutting;
    ok('the paste line fits the Cutting Room and no rail rests shown',
      cr.snip.y + cr.snip.h <= cr.win.contentArea.boxH
      && cr.win.contentArea.vBarVisible === false
      && cr.win.contentArea.hBarVisible === false);

    // a preset re-cut lands its overrides in the live tokens — proven on a token the
    // preset actually CHANGES (a token equal to stock passes vacuously)
    const bk = Object.keys(brass.colors).find((k) => brass.colors[k] !== STOCK[k]);
    themeName = 'brass';
    rebuild();
    await wait(1300); // the stone re-cuts (a full atlas bake)
    ok('a preset re-cut lands its overrides (a changed token took the brass value)',
      bk != null && COLORS[bk] === brass.colors[bk] && COLORS[bk] !== STOCK[bk]);

    // the token diff draws real rows: count the LIVE nodes under the pane and hold
    // them against the model, never the page's own arithmetic
    const dp = window.__gallery.diffPane;
    const chips = dp.children.filter((n) => n instanceof QuadNode).length;
    const rowTexts = dp.children.filter((n) => n instanceof TextNode).length - 1; // minus the header
    const changed = Object.entries(brass.colors).filter(([k, v]) => STOCK[k] !== v).length;
    ok('the token diff renders live rows for the changed tokens',
      chips > 0 && chips <= changed && rowTexts >= chips);

    // a scale reboot must make things BIGGER, not just carry the flag: the same
    // control against the same glass. The css box holds while logical px shrink, so
    // the control's viewport share is the real growth measure.
    const share1 = window.__gallery.presetPick.h / Eldritch.engine.height;
    uiScale = 1.5;
    rebuild();
    await wait(1300);
    const share2 = window.__gallery.presetPick.h / Eldritch.engine.height;
    const grew = share2 / share1;
    ok(`a scale reboot holds the chosen uiScale and the widgets grow ~1.5x [${grew.toFixed(3)}]`,
      Eldritch.engine.uiScale === 1.5 && grew > 1.35 && grew < 1.65);

    // photo mode hides the HUD and restores it
    const pick = window.__gallery.presetPick;
    window.__gallery.photo.dispatch('click', {});
    await wait(300);
    const hidden = pick.visible === false;
    await wait(1600);
    ok('photo mode hides the HUD and restores it',
      hidden && window.__gallery.presetPick.visible === true);

    // restore the stock boot (hygiene — the suite leaves the page as it found it)
    themeName = 'verdigris';
    uiScale = 1;
    rebuild();
    await wait(1200);

    // the ground circle: the wheel is REBUILT with every boot (a
    // re-theme is destroy+init) — the freshly-cut wheel answers the right-click
    Eldritch.engine.bus.emit('pointerdown', { x: 640, y: 620, button: 2, pointerId: 67, target: null, native: null });
    await wait(60);
    ok('ground: the re-cut wheel answers a right-click after three reboots',
      window.__gallery.ground.isOpen === true);
    window.__gallery.ground.close({ silent: true });
    await wait(40);

    ok('three reboots ran without a single page error', window.__errs.length === 0);

    const pre = document.createElement('pre');
    pre.id = 'results';
    pre.style.cssText = 'position:fixed;left:8px;top:8px;color:#8fe8a8;background:rgba(0,0,0,0.85);padding:8px;font:11px Consolas,monospace;z-index:100;margin:0;';
    pre.textContent = results.join('\n');
    document.body.appendChild(pre);
    document.title = `THEMEGALLERY ASSERT ${fails === 0 ? 'PASS' : 'FAIL'} ${results.length - fails}/${results.length}`;
  })();
} else {
  setTimeout(() => {
    document.title = window.__errs.length
      ? 'FAIL ' + String(window.__errs[0]).slice(0, 80)
      : 'THEMEGALLERY READY';
  }, 1000);
}
</script>
</body>
</html>
